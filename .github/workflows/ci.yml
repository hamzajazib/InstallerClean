name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the Dependabot relock job re-run these checks on the commit it pushes: a
  # commit pushed with the default GITHUB_TOKEN starts no workflow run of its own
  # (GitHub's anti-recursion rule), and workflow_dispatch is the documented
  # exception. Also usable as a manual re-run from the Actions tab.
  workflow_dispatch:

# Read-only, declared rather than inherited from the repository default. Every
# step below only reads: two pinned actions, the node guards, dotnet, a
# Chocolatey install and ISCC. Nothing here pushes, comments or uploads an
# artefact, and a job that restores from nuget.org and installs a package from
# the Chocolatey community feed is the one place a build-time dependency could
# reach for whatever token the run is holding.
permissions:
  contents: read

jobs:
  build-and-test:
    # Pinned rather than windows-latest so a GitHub image roll cannot redden an
    # unrelated push: that label moved from Server 2022 (VS2022) to Server 2025
    # (VS2026) on 2026-06-15, and an image change that breaks the build belongs
    # on a deliberate bump of this line rather than on GitHub's schedule.
    # windows-2022 is the fallback if the 2025 image regresses.
    runs-on: windows-2025

    steps:
      # fetch-depth: 0 for the superseded-English gate at the end of this job,
      # which compares every satellite value against every wording the neutral
      # resx has ever held, and so answers for exactly as much history as it is
      # given. The default fetch is one commit. That gate refuses to run in a
      # shallow clone rather than relying on this line, so removing the depth
      # turns the step red.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # EVERY STEP IN THIS JOB RUNS WHETHER OR NOT THE ONE BEFORE IT WENT RED, AND
      # THAT IS A DECISION RATHER THAN BOILERPLATE. Each guard below reads a
      # different part of the tree and none is a premise for any other: the resx
      # contract says nothing about XAML resource keys, and neither says anything
      # about whether the app builds. Without the condition the first red step
      # decides what the rest of the job is allowed to measure, so one guard going
      # red takes every verdict behind it with it and a run carrying several
      # faults reports one. A red step still fails the job. It just no longer
      # speaks for the steps it happens to stand in front of.

      # Source-level satellite contract: key presence, stray keys and {N}
      # placeholder arity across every Strings.<code>.resx. The compiled-
      # resource side is covered by SatelliteResxParityTests in the test run.
      - name: Check resx satellite parity
        if: success() || failure()
        run: node scripts/check-resx-parity.mjs

      # Strings.Designer.cs is hand-regenerated, so it can drift from the neutral
      # resx silently: an accessor whose key has been removed still compiles, and
      # Get() falls back to returning the key, so the first sign is a raw key on
      # screen.
      - name: Check Strings.Designer.cs is in step
        if: success() || failure()
        run: node scripts/check-designer-parity.mjs

      # Source-level drift guards, each pinned to a concrete failure the app has
      # actually hit: a resx key left with no consumer; the installer language
      # set and SupportedLanguages diverging when a language is added to one and
      # not the other. These need only the checkout, not the SDK, so they run
      # before it and report a source fault in seconds rather than after a build.
      - name: Check for dead resx keys
        if: success() || failure()
        run: node scripts/check-dead-resx-keys.mjs

      - name: Check installer language list
        if: success() || failure()
        run: node scripts/check-installer-languages.mjs

      # The two lists of counted strings, compared at the source because a
      # switch's arms are not enumerable at runtime. The script says why.
      - name: Check the counted-string inventory
        if: success() || failure()
        run: node scripts/check-counted-string-inventory.mjs

      # Directory.Build.props and the two app.manifest identities, checked here
      # rather than only at release time: the manifests are build inputs, so
      # after a release has built its binaries the fix costs a rebuild and every
      # hash it was scanned under.
      - name: Check version surfaces agree
        if: success() || failure()
        run: node scripts/check-version-surfaces.mjs

      # The level both hosts ask for decides what the scan concludes about a
      # per-user product it would not be entitled to see, so it is checked with
      # the other build inputs rather than left to whoever next opens a manifest.
      - name: Check both hosts ask for administrator
        if: success() || failure()
        run: node scripts/check-elevation-manifest.mjs

      # One guard reads built files, so it cannot be picked up with the
      # check-*.mjs glob that runs before the build, and is invoked by name in
      # both workflows instead. This is what holds those two lines in place.
      - name: Check the artefact guard is still wired into both workflows
        if: success() || failure()
        run: node scripts/check-guard-wiring.mjs

      # A French value that lost its narrow no-break space to a plain space,
      # which plenty of editors do silently.
      - name: Lint French spacing
        if: success() || failure()
        run: node scripts/check-french-spacing.mjs

      # Program.cs prints each Cli.Help.* value with Console.WriteLine and wraps
      # nothing, so a translated line over the console's column budget is torn
      # across two rows with the second hard against the left margin. Twelve of
      # the sixteen languages had drifted past it before the guard was written,
      # Russian to 149 columns. Here with the source guards rather than with the
      # gates at the end because it is not one: it passes today, and a language
      # going over is a mistake rather than a translation window.
      - name: Check CLI help fits its column budget
        if: success() || failure()
        run: node scripts/check-cli-help-width.mjs

      # Its sibling above holds how wide a help line may be; this holds where the
      # description column starts, which the sibling states it does not, the
      # column being per-language: it is set by that language's longest
      # installerclean-cli prefix, and a translated metavariable is not the width
      # of PATH, so there is no one number any check could compare against. A
      # translation round is when it goes wrong, reflagging some rows and leaving
      # others translated so the two end up at different columns with every value
      # correct read on its own. Here with the source guards for the same reason
      # as the width check: it passes today, a row still holding the English
      # neutral being left to check-still-english rather than measured.
      - name: Check CLI help columns line up
        if: success() || failure()
        run: node scripts/check-cli-help-alignment.mjs

      # Two faults with one trigger. A {StaticResource} whose key nothing defines,
      # and one whose resource is of a type the consuming property cannot take,
      # both compile clean and both throw when the template is first realised,
      # which is when a user opens that window. Neither the build nor the test
      # run below sees either, because resource lookup happens at neither.
      - name: Check XAML resource keys and types
        if: success() || failure()
        run: node scripts/check-xaml-resources.mjs

      # Text takes its font from the root it is drawn under, a window or a
      # tooltip or menu popup, and a root without the app's font draws a styled
      # TextBlock or a TextBox in the system font. Nothing fails when that
      # happens: the window opens and the line is in the wrong typeface.
      - name: Check every window and popup carries the app font
        if: success() || failure()
        run: node scripts/check-xaml-font.mjs

      # A character missing from the font a language is drawn in is drawn from
      # the next font in its list, in another typeface, and a bundled font with
      # other vertical metrics changes the height of every line drawn in it.
      # Nothing fails when either happens: the window opens with a word or a
      # line that does not match the rest. The fonts for Chinese, Japanese and
      # Korean are read from this runner's Windows Fonts folder.
      - name: Check every language's text is in the font it is drawn in
        if: success() || failure()
        run: node scripts/check-font-coverage.mjs

      # A production caller may pass the action services an empty set of claims and
      # the compiler cannot see it: the argument is required, so passing the wrong
      # value satisfies it. The under-lease re-read then returns a pass at its first
      # line without having asked anything. The tests below drive the call sites that
      # exist; this is what fails on the day somebody writes a new one.
      - name: Check the under-lease claims reach the action services
        if: success() || failure()
        run: node scripts/check-under-lease-claims.mjs

      # An Application-channel value is machine-read and is built in en-GB at the
      # write site, whatever the machine's language. This fails where a test
      # composes one outside MachineContract.English or MachineContract.WriteEventLog,
      # where it takes the language the test runs in. It prints every reference it
      # finds, in scope or not.
      - name: Check the tests compose machine-contract values in scope
        if: success() || failure()
        run: node scripts/check-machine-contract-scope.mjs

      # A Debug build reads switches a developer sets on their own PC, and a Release
      # build must not contain them. This fails where a switch's name, or a read of
      # the environment the script does not list, sits outside #if DEBUG; where a
      # project file, a response file or a workflow defines DEBUG outside the Debug
      # configuration; and where a publish in release.yml names a configuration other
      # than Release. It prints every name, read and definition it finds, and stops
      # where a switch's own name or read is not found.
      - name: Check the Debug-only switches stay out of Release builds
        if: success() || failure()
        run: node scripts/check-debug-only-switches.mjs

      # Every step in this job carries the same condition, for the reason set
      # out at the first guard: no step here is a premise for any other, so a
      # red one reports its own verdict and decides nothing about the rest.
      - name: Setup .NET SDK
        if: success() || failure()
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # NuGet Audit runs during restore and reports a vulnerable package as a
      # warning; -warnaserror turns that into a failed step. `dotnet list package
      # --vulnerable` exits 0 while printing a high-severity advisory, so a step
      # built on it stays green on a vulnerable package. NuGetAuditMode=all is
      # explicit because an advisory can arrive through a transitive package as
      # well as a direct one.
      #
      # Keep this ahead of anything that restores. Restore is idempotent and
      # silent on a second call: after a build it prints "All projects are
      # up-to-date for restore" and emits no NU190x at all, so a step placed there
      # stays green over a graph nobody audited.
      - name: Fail on a vulnerable package
        if: success() || failure()
        run: dotnet restore src/InstallerClean.sln -p:RestoreLockedMode=true -p:NuGetAuditMode=all -warnaserror:NU1901,NU1902,NU1903,NU1904

      - name: Build
        if: success() || failure()
        run: dotnet build src/InstallerClean/InstallerClean.csproj -p:RestoreLockedMode=true

      - name: Build CLI
        if: success() || failure()
        run: dotnet build src/InstallerClean.Cli/InstallerClean.Cli.csproj -p:RestoreLockedMode=true

      # The tests set en-GB for themselves, culture and UI culture alike
      # (src/InstallerClean.Tests/AssemblyInfo.cs). This prints the runner's own
      # culture and UI culture, the two that setting takes the place of.
      - name: Print the runner's culture
        if: success() || failure()
        shell: pwsh
        run: |
          $culture = [System.Globalization.CultureInfo]::CurrentCulture
          $ui = [System.Globalization.CultureInfo]::CurrentUICulture
          "Culture:    $(if ($culture.Name) { $culture.Name } else { 'invariant' })"
          "UI culture: $(if ($ui.Name) { $ui.Name } else { 'invariant' })"

      - name: Test
        if: success() || failure()
        run: dotnet test src/InstallerClean.Tests/ -p:RestoreLockedMode=true

      # A build reports a broken reference in a documentation comment only when
      # it writes the documentation file, which no project here asks for. This
      # build asks for it and fails on every documentation warning except the
      # three that ask for more documentation: CS1591, CS1573 and CS1712. It
      # fails on CS1570 and CS1587 as well as on the reference warnings, because
      # the compiler resolves no reference inside a comment that is badly formed
      # or is not on a member, so a broken reference there shows up only as one
      # of those two. --no-incremental makes the compiler run whatever was built
      # before this step: an incremental build skips the compiler for a project
      # whose outputs are current, and a skipped compile reports nothing.
      - name: Check documentation comments
        if: success() || failure()
        run: dotnet build src/InstallerClean.sln --no-incremental -p:RestoreLockedMode=true -p:GenerateDocumentationFile=true -warnaserror:CS0419,CS1570,CS1571,CS1572,CS1574,CS1580,CS1581,CS1584,CS1587,CS1589,CS1590,CS1592,CS1658,CS1710,CS1711,CS1723,CS1734,CS1735,CS8018 -nowarn:CS1591,CS1573,CS1712

      # Everything from here to the setup compile depends on the BUILD having
      # succeeded, not on the tests having passed, and a red test run is precisely
      # when somebody wants to know that the downloads still publish and that the
      # .iss still compiles. Carrying no condition, all of them were skipped by a
      # red Test, which is how a reorder that put the language gates last still left
      # the .iss having never been compiled anywhere.
      - name: Smoke-publish self-contained
        if: success() || failure()
        run: dotnet publish src/InstallerClean/InstallerClean.csproj -c Release -r win-x64 --self-contained true -p:RestoreLockedMode=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish/self-contained

      # PublishSelfContained=false is what disables the .NET 8+ rule
      # "PublishSingleFile=true implies SelfContained=true". --self-contained false
      # sets the other property and .NET 10 no longer takes it, so both are passed
      # here: with the first alone, a publish comes out in the self-contained shape
      # under a framework-dependent name, tens of times the size it should be. The
      # flags below are the release script's own (dotnet/sdk#52070), which is what
      # makes this a smoke test of the shape that ships rather than a second copy
      # of the step above it.
      - name: Smoke-publish framework-dependent
        if: success() || failure()
        run: dotnet publish src/InstallerClean/InstallerClean.csproj -c Release -r win-x64 -p:RestoreLockedMode=true -p:PublishSelfContained=false -p:SelfContained=false -p:PublishSingleFile=true -o publish/framework-dependent

      - name: Smoke-publish CLI framework-dependent
        if: success() || failure()
        run: dotnet publish src/InstallerClean.Cli/InstallerClean.Cli.csproj -c Release -r win-x64 -p:RestoreLockedMode=true -p:PublishSelfContained=false -p:SelfContained=false -p:PublishSingleFile=true -o publish/cli-framework-dependent

      # publish/cli is where installer/InstallerClean.iss reads the CLI from, so
      # it holds the self-contained single-file build: that is the shape the
      # release script puts there and the shape the shipped setup embeds. The
      # framework-dependent publish above parks beside it and exercises the
      # lighter build without deciding what the compile step below bundles.
      #
      # Compression ON is the default and the preferred shape: it roughly halves
      # a download whose whole audience is people wary of what they are running,
      # and size is the one thing a wary reader judges before opening anything.
      # Dropping it is a FALLBACK, taken per release and only on evidence, when a
      # scan flags the compressed build and the uncompressed build of the same
      # source comes back clean. That fallback has fired once, for the 2.3.0
      # standalone CLI, and it does not carry forward: each release starts from
      # compressed and earns its way off. Whichever shape a release ships, this
      # flag must match the release script's, because the README tells readers
      # they can rebuild a tag and compare hashes and this file is the only
      # public statement of how.
      - name: Smoke-publish CLI self-contained
        if: success() || failure()
        run: dotnet publish src/InstallerClean.Cli/InstallerClean.Cli.csproj -c Release -r win-x64 --self-contained true -p:RestoreLockedMode=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish/cli

      # Here rather than with the other guards because it reads the three
      # published files, which do not exist until the steps above have run. A
      # satellite that never reaches an artefact leaves the source resx present
      # and correct, so every guard that reads the tree passes and the window
      # opens in English on a machine set to that language.
      - name: Check the built artefacts carry every satellite assembly and ask for administrator
        if: success() || failure()
        run: node scripts/verify-shipped-artefacts.mjs

      # ISCC is the only thing that reads installer/*.iss, so a typo there shows
      # up nowhere else. Compiling the setup here finds it on the push that
      # caused it rather than on the release machine. The self-contained GUI
      # and CLI publishes above put the exes exactly where the [Files] section
      # looks for them, in the shapes the release script builds, so this
      # compiles the real setup rather than a stub. Repointing either at a
      # different publish directory quietly turns it back into one.
      #
      # The compile step fails on any warning ISCC prints, as well as on a
      # failed compile. A message missing from one language's .isl is a warning
      # and no more: the compile goes on, and that language's wizard shows the
      # text from another language in its place, English for a [Messages] entry
      # and the first language that defines it for a [CustomMessages] one. ISCC
      # prints each warning at the end of the compile as a line starting
      # "Warning: ", and writes no such line under /Q or /Qp, so either option
      # on the command line below lets a missing message through. Setting
      # MissingMessagesWarning=no in the script's [Setup] section does the same
      # for a [Messages] entry, by turning that warning off at the source.
      #
      # The version is pinned for the same reason the runner is: an Inno release
      # must not redden an unrelated push. 6.7.1 is the compiler that built the
      # shipped 2.0.x setups, and it is the one the bundled "Inno Setup 6.5.0+"
      # community .isl files are known to compile against. Bump it deliberately.
      # Conditioned with the compile below rather than left to the default: ISCC
      # is not on the runner image, so a compile step that runs past a red Test
      # while its installer step did not fails on a missing ISCC.exe and reports
      # nothing about the .iss.
      - name: Install Inno Setup
        if: success() || failure()
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Compile the installer
        if: success() || failure()
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}" -Filter ISCC.exe -Recurse -Depth 1 -ErrorAction SilentlyContinue |
                  Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "ISCC.exe not found under ${env:ProgramFiles(x86)} after installing Inno Setup." }
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version |
                     Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw "Could not read <Version> from Directory.Build.props." }
          & $iscc "/DAppVersion=$version" installer\InstallerClean.iss | Tee-Object -Variable compileOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $warnings = @($compileOutput | Where-Object { $_ -like 'Warning: *' })
          if ($warnings.Count -gt 0) {
            ''
            'ISCC printed these warnings, and any warning fails this step:'
            $warnings
            exit 1
          }

      # The seven language gates run last, and each runs even when one before it
      # has failed. Every one is named below, because a gate left out of the list
      # gets read as deliberate by default.
      #
      # FOUR HOLD THE SATELLITES IN STEP WITH THE ENGLISH, so each goes red when
      # a string in the neutral resx moves and the satellites, or the pages built
      # from them, have not yet followed: check-still-english, on a satellite
      # value that is still the English neutral; check-translation-freshness, on
      # a ledger entry recording a translation made against an English the
      # neutral has since replaced, or standing on a key the satellite or the
      # neutral no longer holds; the generator reproduction check, whose diff
      # catches a satellite the generators would now write differently and whose
      # TEMPLATE OK holds a template the reworded neutral has left behind; and
      # gen-translation-table --check, whose pages are generated from the resx.
      #
      # THREE ARE EXPECTED GREEN AT ALL TIMES and their red means a mistake:
      # check-accelerators, check-cross-key-rules and check-superseded-english.
      # The last reads the satellites too, but a satellite holding a wording the
      # English has ABANDONED is never a state a translation is on its way to
      # producing.
      #
      # They sit after the build and the test run, so a red language gate never
      # stops either of those from running. Each runs under !cancelled(), so one
      # red gate does not hide the ones after it, and unlike always() it stands
      # down on a cancelled job instead of posting a failure for every gate left.
      # Nothing is softened by the position: a failure here fails the job exactly
      # as one at the top does.

      # The premise every resx guard in this job rests on: each Strings.<code>.resx
      # is a byte-reproducible artefact of its generator in scripts/translations/.
      # All of them read the resx, so a value hand-edited there and not into its
      # generator passes every one and is reverted by whoever next runs the loop.
      # That has happened once. The generators are tracked now and CONTRIBUTING.md
      # sends translators straight at them.
      #
      # The diff holds reproducibility. TEMPLATE OK holds the template, which
      # writes no satellite for a diff to catch and which flag-retranslation.mjs
      # skips by name, so a reworded neutral leaves it holding the old English.
      # The satellites' own verdict lines are deliberately not read: they say
      # "still English (untranslated)" for every key awaiting a translation
      # round, which is what check-still-english below holds, and a generator's
      # exit code does not follow them. What it does follow is the parse control,
      # which stops the generator before it writes anything, so the loop below
      # keeps every generator's status rather than only the last one's.
      - name: Check every satellite reproduces from its generator
        if: '!cancelled()'
        shell: bash
        run: |
          # Each generator's status is kept as the loop goes. A command
          # substitution around the whole loop carries only the last one's, so
          # all but the last would have nowhere to report from.
          #
          # The check on them runs before the diff because a generator that stops
          # early leaves its satellite untouched, so the diff has nothing to say
          # about the one language that did not run.
          log=
          stopped=
          for g in scripts/translations/gen-strings-*.mjs; do
            out=$(node "$g") || stopped="$stopped $(basename "$g")"
            log="$log$out"$'\n'
          done
          echo "$log"
          if [ -n "$stopped" ]; then
            echo "Generators that did not finish:$stopped" >&2
            exit 1
          fi
          git diff --exit-code -- src/InstallerClean.Core/Resources
          # A case rather than a pipe into grep: the runner sets pipefail, and a
          # grep that exits on its first match can leave the echo feeding it
          # killed by SIGPIPE, which would fail this step over a log that said
          # the right thing.
          case "$log" in
            *"TEMPLATE OK"*) ;;
            *)
              echo "gen-strings-template.mjs did not report TEMPLATE OK; its output is above." >&2
              exit 1
              ;;
          esac

      - name: Check the access-key sets for a clash
        if: '!cancelled()'
        # Two controls live on one window at one moment must not share an Alt
        # access key: WPF answers a duplicate by cycling focus between the
        # matches instead of invoking either, so a clash silently retires BOTH,
        # in one language, on the route only a keyboard or screen-reader user
        # takes. An eye-verify pass runs in a single language and reads the
        # English accelerator, so nothing but this sees it.
        run: node scripts/check-accelerators.mjs

      # The rules that live BETWEEN two strings, or between a string and the
      # code that shows it: a spoken name against its visible label, a sentence
      # against the button it quotes, the installer-folder token, a window title
      # whose only consumer overwrites it. Every other check here holds one key's
      # structure or one key's sameness across files, so none of them can see a
      # rule of that shape, and the About window's donate button consequently
      # showed one phrase and spoke another in two languages across four
      # releases.
      #
      # A red naming a language is a fix in that language's generator under
      # scripts/translations/, never a hand-edit of the resx the message names.
      # Rules 7 and 8 fault the XAML and the C# instead and carry their own
      # instruction, which is what the script's closing footer is gated on.
      - name: Check cross-key rules
        if: '!cancelled()'
        run: node scripts/check-cross-key-rules.mjs

      # A required gate: a satellite shipping the English neutral for a
      # required key fails the build. Expected to fail on the commits between a
      # string's English landing and its translation round running, rather than
      # only on a mistake.
      - name: Check no satellite value is still the English
        if: '!cancelled()'
        run: node scripts/check-still-english.mjs

      # A different question from check-still-english's, and the two divide the
      # subject between them. That gate compares a satellite value against the
      # CURRENT neutral; this one compares it against every wording the neutral
      # has ever held, which is what identifies a value holding English the app
      # has since replaced. Comparing against a history means it answers for
      # exactly as much of one as it is given, so it needs the full fetch the
      # checkout at the top of this job asks for, and refuses to run without it.
      #
      # A hard gate rather than a translation-window one: a satellite holding a
      # wording the app has ABANDONED is not a state the translation pass is on
      # its way to producing. The script's own header sets out why that leaves it
      # with no false positives to trade against.
      - name: Check no satellite holds superseded English
        if: '!cancelled()'
        run: node scripts/check-superseded-english.mjs

      # The one thing about a translation nothing else asks: whether it has
      # fallen behind its English. Still-English fires when a satellite value
      # equals the CURRENT neutral, the gate above when it equals a FORMER one,
      # resx parity compares key presence and numeric placeholder arity, and
      # cross-key rules enforce named tokens. A satellite holding a TRANSLATION
      # of the previous English of a rewritten key matches nothing any of them
      # compares it against.
      #
      # IT ANSWERS FROM A LEDGER, so what it can say depends on what the ledger
      # carries. A key-slot the ledger holds is reported and fails the build once
      # the English has moved past it. So does an entry the English gives
      # nothing to measure against, such as one for a key taken out of it, and
      # so does one for a language with no satellite. A key-slot outside the
      # ledger is named in a NOTE line and is one the run makes no claim about.
      - name: Check translations against the freshness ledger
        if: '!cancelled()'
        run: node scripts/check-translation-freshness.mjs

      # docs/translations/*.md carry the same "generated, never hand-edited"
      # contract as the resx guards above. They are the pages the translation
      # feedback issue template and CONTRIBUTING.md point native speakers at, so
      # a stale one asks for corrections to text that no longer exists.
      - name: Check translation review tables are in step
        if: '!cancelled()'
        run: node scripts/gen-translation-table.mjs --check

  # The four packages.lock.json files are the project's only statement of what
  # is in the shipped binary closure, and every restore in the job above is
  # windows-2025, where System.Diagnostics.EventLog resolves out of the Desktop
  # shared framework whether the lock lists it or not. A lock that has lost it
  # therefore restores clean on Windows and fails NU1004 on Linux, so the job
  # above cannot see that gap and this restore is the one that can.
  #
  # A separate job rather than a step, because the one above is pinned to
  # windows-2025 and this has to run somewhere else. It reads the same locks
  # from the same checkout and writes nothing.
  #
  # It gates nothing on its own: branch protection requires build-and-test and
  # Analyse C# by name, so this has to be added there before a red one can stop
  # a merge. Until it is, the log is the whole of it.
  lock-files:
    name: Lock files (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore in locked mode
        run: dotnet restore src/InstallerClean.sln -p:EnableWindowsTargeting=true -p:RestoreLockedMode=true


  # Where each shipped build loads the Windows libraries it uses from. The app runs
  # elevated, and a portable or slim copy is often run from a Downloads folder, so a
  # library it would load from its own folder is one a file dropped there would
  # replace. Each build is published with release.yml's flags and run in two passes,
  # with Process Monitor recording every file the build's process opens or probes.
  #
  # The first pass runs each build from an empty folder of its own and notes every
  # .dll it looked for there, and every one it looked for under %TEMP%\.net, where a
  # single-file build extracts itself. The second pass runs each build again with a
  # file of each of those names planted at the path that was looked at: one the build
  # loaded under that name in the first pass, else System32's, else, where no file on
  # the runner carries the name, a small System32 library under it. The job fails where a build loaded, mapped
  # or read a planted file, where no look found a planted file in place, and where one
  # had changed by the time the build ended. In either pass it also fails where a build
  # loaded a library from its own folder, and in the second where it loaded one under
  # %TEMP%\.net that its bundle did not extract in the first. The files planted under
  # %TEMP%\.net are removed as the first act of the step that traces each build's start.
  # A hostfxr.dll or hostpolicy.dll planted beside a build runs on its own, since the
  # apphost reads those before the runtime starts and taking one can stop the build
  # starting at all.
  #
  # Every look is printed with its full path, its place among the process's rows, and
  # whether it came after the first act of the build's own code that Process Monitor
  # can see: a file under C:\Windows\Installer, one under %LOCALAPPDATA%\InstallerClean,
  # or the load of msi.dll.
  #
  # It refuses to pass on a run that saw nothing: Process Monitor has to have started
  # and recorded each build's process, the command line has to have loaded msi.dll
  # for its scan, and each window has to have loaded dwmapi.dll and WPF's
  # wpfgfx_cor3.dll, which it does only once it creates a window, so a window that
  # could not open on the runner fails the job. A run with an apphost library planted
  # alone is the exception and is judged without its must-loads.
  #
  # The slim's exe finds .NET only where .NET is installed, so the job fails where the
  # first pass sees the slim look for hostfxr.dll or hostpolicy.dll in its own folder.
  # After both passes each build is started once more with the .NET host's trace on,
  # with a hostfxr.dll planted beside the slim and a decoy .NET install named by
  # DOTNET_ROOT. The job fails where that trace shows the slim's exe searching for .NET
  # anywhere but the registered or default install, or loading a hostfxr.dll from
  # anywhere else, and where a slim published to search DOTNET_ROOT as well does not
  # load the decoy's. It prints the folders each build's runtime searches for native
  # libraries.
  #
  # Then each build is started with the switch a copy updating itself passes the
  # newer version, and the job fails where the build does not say within 60 s that its
  # own code is running.
  #
  # Last, each build is started with a start-up hook named by DOTNET_STARTUP_HOOKS,
  # and so is each published again with start-up hooks allowed. The job fails where a
  # shipped build runs the hook, where an allowing build does not, and where any build
  # does not say within 60 s that its own code is running.
  #
  # A window started on a fresh account offers to send a report. Before any build
  # runs, the PC-wide first-run mark is set, so the offer is never made, and the
  # report receiver's host is pointed nowhere in the hosts file. The job fails where
  # either window left a report behind.
  native-libraries:
    name: Native libraries (Windows)
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Publish the three builds as release.yml does
        run: |
          dotnet publish src/InstallerClean.Cli/InstallerClean.Cli.csproj -c Release -r win-x64 --self-contained true -p:RestoreLockedMode=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --nologo -o publish/cli
          if ($LASTEXITCODE -ne 0) { throw "The command line did not publish." }
          dotnet publish src/InstallerClean/InstallerClean.csproj -c Release -r win-x64 --self-contained true -p:RestoreLockedMode=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --nologo -o publish/self-contained
          if ($LASTEXITCODE -ne 0) { throw "The portable did not publish." }
          dotnet publish src/InstallerClean/InstallerClean.csproj -c Release -r win-x64 -p:RestoreLockedMode=true -p:PublishSelfContained=false -p:SelfContained=false -p:PublishSingleFile=true --nologo -o publish/framework-dependent
          if ($LASTEXITCODE -ne 0) { throw "The slim did not publish." }

      # FirstRunRecorded under HKLM\SOFTWARE\NoFaff\InstallerClean is the mark a
      # window reads to decide this PC has run InstallerClean before, and with it set
      # no report is offered or saved. The hosts entry stops anything reaching the
      # receiver even so.
      #
      # The name is resolved before the entry is written and has to come back with a
      # real address, so the check after it is reading a resolver that answers. With
      # the entry in place the lookup passes where it returns no address other than
      # 0.0.0.0 and ::, or none at all, including as the HostNotFound or NoData that
      # GetHostAddresses throws for a name with no address. Any other address, or any
      # other error, fails the step.
      - name: Keep the windows from sending a report
        shell: pwsh
        run: |
          New-Item -Path 'HKLM:\SOFTWARE\NoFaff\InstallerClean' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\NoFaff\InstallerClean' -Name FirstRunRecorded -PropertyType DWord -Value 1 -Force | Out-Null
          $mark = (Get-ItemProperty 'HKLM:\SOFTWARE\NoFaff\InstallerClean').FirstRunRecorded
          if ($mark -ne 1) { throw "The first-run mark was not set." }

          $receiver = 'nofaff.netlify.app'
          $nowhere = '0.0.0.0', '::'
          try {
            $before = @([System.Net.Dns]::GetHostAddresses($receiver) | ForEach-Object { $_.ToString() })
          }
          catch {
            throw "The lookup of $receiver before the hosts entry is written failed: $($_.Exception.Message)"
          }
          if (-not @($before | Where-Object { $_ -notin $nowhere }).Count) {
            throw "$receiver resolves to $(if ($before.Count) { $before -join ', ' } else { 'no address' }) before the hosts entry is written."
          }

          $hosts = Join-Path $env:SystemRoot 'System32\drivers\etc\hosts'
          $entries = $nowhere | ForEach-Object { "$_ $receiver" }
          Add-Content -Path $hosts -Value ("`r`n" + ($entries -join "`r`n"))
          $written = @(Get-Content $hosts)
          foreach ($entry in $entries) {
            if ($written -notcontains $entry) { throw "The hosts file does not hold '$entry'." }
          }
          ipconfig /flushdns | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "ipconfig /flushdns failed with $LASTEXITCODE, so the lookup below could read $receiver's address from before the hosts entry." }

          $lookupError = $null
          try {
            $after = @([System.Net.Dns]::GetHostAddresses($receiver) | ForEach-Object { $_.ToString() })
          }
          catch {
            $lookupError = $_.Exception
            while ($lookupError -and $lookupError -isnot [System.Net.Sockets.SocketException]) { $lookupError = $lookupError.InnerException }
            if (-not $lookupError) { throw "The lookup of $receiver with the hosts entry in place failed: $($_.Exception.Message)" }
            if ($lookupError.SocketErrorCode -notin 'HostNotFound', 'NoData') {
              throw "The lookup of $receiver with the hosts entry in place did not finish: $($lookupError.SocketErrorCode)."
            }
            $after = @()
          }
          $elsewhere = @($after | Where-Object { $_ -notin $nowhere })
          if ($elsewhere.Count) { throw "$receiver still resolves to $($elsewhere -join ', ') with the hosts entry in place." }
          $answer = if ($after.Count) { $after -join ', ' } elseif ($lookupError) { "no address ($($lookupError.SocketErrorCode))" } else { 'no address' }
          "  first-run mark set; $receiver resolved to $($before -join ', ') before the hosts entry and to $answer after it"

      # Both passes dot-source these. Every Process Monitor call is bounded, so one
      # that hangs fails the job with a message, and a record starts only once no
      # earlier Process Monitor is left, since one started while another is ending
      # can hand its arguments over to it instead of recording.
      - name: Get Process Monitor and write the functions both passes use
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'procmon'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $procmon = Join-Path $dir 'Procmon64.exe'
          Invoke-WebRequest https://live.sysinternals.com/Procmon64.exe -OutFile $procmon
          $sig = Get-AuthenticodeSignature $procmon
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw "Procmon64.exe is not validly signed by Microsoft: $($sig.Status), $($sig.SignerCertificate.Subject)"
          }
          "PROCMON=$procmon" | Add-Content $env:GITHUB_ENV

          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'native.ps1') -Value @'
          $procmon = $env:PROCMON
          $failures = [System.Collections.Generic.List[string]]::new()
          function Fail([string]$message) { $failures.Add($message); Write-Host "::error::$message" }

          $builds = @(
            [pscustomobject]@{ Label = 'command line'; Exe = 'publish/cli/installerclean-cli.exe'; Arguments = @('/s', '/noupdate'); Wait = 60; MustLoad = @('msi.dll') },
            [pscustomobject]@{ Label = 'portable'; Exe = 'publish/self-contained/InstallerClean.exe'; Arguments = @(); Wait = 20; MustLoad = @('dwmapi.dll', 'wpfgfx_cor3.dll') },
            [pscustomobject]@{ Label = 'slim'; Exe = 'publish/framework-dependent/InstallerClean.exe'; Arguments = @(); Wait = 20; MustLoad = @('dwmapi.dll', 'wpfgfx_cor3.dll') }
          )

          # The apphost reads these before the runtime starts. A planted one it takes can
          # stop the build starting at all, so they are planted in a run of their own.
          $plantedAlone = 'hostfxr.dll', 'hostpolicy.dll'

          # A name looked for that no file on the runner carries is planted as this
          # library under that name, so the look is judged like any other.
          $standIn = Join-Path $env:SystemRoot 'System32\msimg32.dll'

          function Invoke-Procmon([string[]]$arguments, [int]$seconds, [string]$what) {
            $p = Start-Process $procmon -ArgumentList $arguments -PassThru
            if (-not $p.WaitForExit($seconds * 1000)) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              throw "Process Monitor did not finish $what within $seconds s."
            }
          }

          function Wait-ProcmonGone([string]$what) {
            $deadline = [DateTime]::UtcNow.AddSeconds(60)
            while (Get-Process -Name Procmon64 -ErrorAction SilentlyContinue) {
              if ([DateTime]::UtcNow -gt $deadline) { throw "Process Monitor was still running 60 s after $what." }
              Start-Sleep -Milliseconds 500
            }
          }

          function Start-Record([string]$name) {
            if (Get-Process -Name Procmon64 -ErrorAction SilentlyContinue) { Invoke-Procmon @('/Terminate') 60 'ending a record left running' }
            Wait-ProcmonGone 'the earlier record ended'
            $pml = Join-Path (Split-Path $procmon) "$name.pml"
            Start-Process $procmon -ArgumentList '/AcceptEula', '/Quiet', '/Minimized', '/BackingFile', "`"$pml`""
            Invoke-Procmon @('/AcceptEula', '/WaitForIdle') 120 "starting the $name record"
          }

          function Stop-Record([string]$name) {
            $dir = Split-Path $procmon
            Invoke-Procmon @('/Terminate') 60 "ending the $name record"
            Wait-ProcmonGone "the $name record was ended"
            $csv = Join-Path $dir "$name.csv"
            Invoke-Procmon @('/AcceptEula', '/Quiet', '/OpenLog', "`"$dir\$name.pml`"", '/SaveAs', "`"$csv`"") 300 "saving the $name record"
            Wait-ProcmonGone "the $name record was saved"
            if (-not (Test-Path $csv)) { throw "Process Monitor saved no $name record." }
            $csv
          }

          # One build at a time, each ended and waited for before the next starts, since
          # the windows share the single-instance mutex. The command line scans and ends;
          # a window is given twenty seconds and then ended.
          function Invoke-Build($build, [string]$label, [string]$folder) {
            $start = @{ FilePath = (Join-Path $folder (Split-Path $build.Exe -Leaf)); WorkingDirectory = $folder; PassThru = $true }
            if ($build.Arguments.Count) { $start.ArgumentList = $build.Arguments }
            $p = Start-Process @start
            # Read now, so the exit code is kept once the process ends.
            $null = $p.Handle
            if (-not $p.WaitForExit($build.Wait * 1000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; $p.WaitForExit() }
            Write-Host "  ${label}: process $($p.Id), ended with $($p.ExitCode)"
            $p.Id
          }

          # Each run's rows, by process. Process Monitor writes the record in event order,
          # so a row's place among its process's rows is its place in that sequence. Rows
          # are taken by process ID as well as name, since other processes on the runner
          # can carry the same name.
          function Read-Record([string]$csv, [object[]]$runs) {
            $exes = @{}
            foreach ($run in $runs) {
              if ($exes.ContainsKey([string]$run.Id)) { Fail "Two runs had process $($run.Id) in one record, so neither is judged." }
              $exes[[string]$run.Id] = $run.Exe
            }
            $shared = @($runs | Group-Object { [string]$_.Id } | Where-Object Count -gt 1 | ForEach-Object Name)
            $byProcess = @{}
            Import-Csv $csv | ForEach-Object {
              $exe = $exes[$_.PID]
              if ($exe -and $_.'Process Name' -eq $exe -and $_.PID -notin $shared) {
                if (-not $byProcess.ContainsKey($_.PID)) { $byProcess[$_.PID] = [System.Collections.Generic.List[object]]::new() }
                $byProcess[$_.PID].Add($_)
              }
            }
            Write-Host "Process Monitor recorded $([int]($byProcess.Values | Measure-Object -Property Count -Sum).Sum) operations by the builds."
            $byProcess
          }

          # Every .dll row in a run's own folder or under %TEMP%\.net, where a single-file
          # build extracts its own libraries, and every library it loaded from anywhere.
          function Get-Libraries($rows, [string]$folder) {
            $own = $folder.TrimEnd('\') + '\'
            for ($i = 0; $i -lt $rows.Count; $i++) {
              $row = $rows[$i]
              if (-not $row.Path.EndsWith('.dll', 'OrdinalIgnoreCase')) { continue }
              $place = if ($row.Path.StartsWith($own, 'OrdinalIgnoreCase')) { 'own' } elseif ($row.Path -match '\\\.net\\') { 'extraction' } else { 'elsewhere' }
              if ($place -eq 'elsewhere' -and $row.Operation -ne 'Load Image') { continue }
              [pscustomobject]@{
                Index = $i + 1; Place = $place; Operation = $row.Operation; Result = $row.Result
                Relative = $(if ($place -eq 'own') { $row.Path.Substring($own.Length) })
                Path = $row.Path; Name = (Split-Path $row.Path -Leaf).ToLowerInvariant(); Time = $row.'Time of Day'
              }
            }
          }

          # The first act of the build's own code that Process Monitor can see: a file
          # under C:\Windows\Installer, one under %LOCALAPPDATA%\InstallerClean, or the
          # load of msi.dll. A row after it came after the build's own code started.
          function Get-Marker($rows) {
            for ($i = 0; $i -lt $rows.Count; $i++) {
              $row = $rows[$i]
              if ($row.Path -match '^C:\\Windows\\Installer(\\|$)' -or $row.Path -match '\\AppData\\Local\\InstallerClean(\\|$)' -or
                  ($row.Operation -eq 'Load Image' -and (Split-Path $row.Path -Leaf) -eq 'msi.dll')) {
                return [pscustomobject]@{ Index = $i + 1; What = "$($row.Operation) $($row.Path)" }
              }
            }
          }

          function Get-When($library, $marker) {
            if ($marker -and $library.Index -gt $marker.Index) { 'after its own code began' } else { 'before any act of its own code seen' }
          }

          function Show-Libraries($libraries, $marker, [string]$firstTime) {
            Write-Host "  first row at $firstTime"
            if ($marker) { Write-Host "  first act of its own code seen: row $($marker.Index), $($marker.What)" }
            else { Write-Host "  no act of its own code seen" }
            Write-Host "  every look in its own folder and under %TEMP%\.net (row, time, operation, result, times seen, path):"
            $libraries | Where-Object { $_.Place -ne 'elsewhere' -and $_.Operation -ne 'Load Image' } |
              Group-Object Path, Operation, Result | Sort-Object { $_.Group[0].Index } | ForEach-Object {
                $first = $_.Group[0]
                Write-Host "    row $($first.Index)  $($first.Time)  $($first.Operation)  $($first.Result)  x$($_.Count)  $($first.Path)  ($(Get-When $first $marker))"
              }
            Write-Host "  libraries loaded:"
            $libraries | Where-Object Operation -eq 'Load Image' | ForEach-Object Path | Sort-Object -Unique | ForEach-Object { Write-Host "    $_" }
          }

          # The genuine file for a name: one the build loaded under that name from
          # anywhere but its own folder, else System32's, else the stand-in.
          function Get-Plant([string]$name, $loads) {
            $loaded = @($loads | Where-Object { $_.Name -eq $name -and $_.Place -ne 'own' })
            $system = Join-Path $env:SystemRoot "System32\$name"
            if ($loaded) { [pscustomobject]@{ Source = $loaded[0].Path; Kind = 'the copy it loaded' } }
            elseif (Test-Path -LiteralPath $system) { [pscustomobject]@{ Source = $system; Kind = "System32's copy" } }
            else { [pscustomobject]@{ Source = $standIn; Kind = 'a stand-in, since no file on the runner carries this name' } }
          }

          # Prints a run's rows and returns its libraries, its loads and its marker, or
          # nothing where Process Monitor recorded nothing for it.
          function Read-Run($run, $byProcess) {
            Write-Host "== $($run.Label), $($run.Exe), process $($run.Id)"
            $rows = $byProcess[[string]$run.Id]
            if (-not $rows) { Fail "$($run.Label): Process Monitor recorded nothing for process $($run.Id)."; return }
            Write-Host "  $($rows.Count) operations"
            $libraries = @(Get-Libraries $rows $run.Folder)
            $marker = Get-Marker $rows
            Show-Libraries $libraries $marker $rows[0].'Time of Day'
            [pscustomobject]@{ Libraries = $libraries; Loads = @($libraries | Where-Object Operation -eq 'Load Image'); Marker = $marker }
          }

          function Test-MustLoad($run, $loads) {
            if (-not $run.Build.MustLoad) { Fail "$($run.Label) names nothing it must load."; return }
            foreach ($name in $run.Build.MustLoad) {
              if (-not ($loads | Where-Object Name -eq $name)) {
                Fail "$($run.Label) never loaded $name, so it did not get far enough for this check to judge it."
              }
            }
          }

          # The folder a run's copy of its build is started from, named for the pass and the run.
          function Get-RunFolder([string]$pass, [string]$label) {
            Join-Path $env:RUNNER_TEMP ("$pass-" + ($label -replace '[^A-Za-z0-9]+', '-'))
          }

          # Ends the step with every failure listed, where there was one.
          function Exit-IfFailed {
            if (-not $failures.Count) { return }
            Write-Host "$($failures.Count) checks failed:"
            $failures | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          '@

      - name: First pass, with nothing planted
        shell: pwsh
        run: |
          . (Join-Path $env:RUNNER_TEMP 'native.ps1')
          "  interactive: $([Environment]::UserInteractive); session $((Get-Process -Id $PID).SessionId)"
          $runtimes = dotnet --list-runtimes
          $runtimes
          if (-not ($runtimes | Where-Object { $_ -match '^Microsoft\.WindowsDesktop\.App 10\.' })) {
            throw "No .NET 10 Desktop Runtime is installed, so the slim cannot start."
          }

          Start-Record 'first'
          $runs = foreach ($build in $builds) {
            $folder = Get-RunFolder 'first' $build.Label
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
            Copy-Item $build.Exe $folder
            $id = Invoke-Build $build $build.Label $folder
            [pscustomobject]@{ Label = $build.Label; Build = $build; Folder = $folder; Exe = (Split-Path $build.Exe -Leaf); Id = $id }
          }
          $byProcess = Read-Record (Stop-Record 'first') $runs

          $planned = [System.Collections.Generic.List[object]]::new()
          foreach ($run in $runs) {
            $read = Read-Run $run $byProcess
            if (-not $read) { continue }
            Test-MustLoad $run $read.Loads
            foreach ($name in $plantedAlone) {
              $beside = @($read.Libraries | Where-Object { $_.Place -eq 'own' -and $_.Operation -ne 'Load Image' -and $_.Relative -eq $name })
              "  looked for $name beside itself: $(if ($beside) { "yes, from row $($beside[0].Index)" } else { 'no' })"
              if ($beside -and $run.Label -eq 'slim') {
                $who = if ($name -eq 'hostfxr.dll') { "so its exe searches that folder for .NET" } else { "where hostfxr.dll looked for it" }
                Fail "The slim looked for $name in the folder it was run from, row $($beside[0].Index), $who."
              }
            }
            foreach ($load in ($read.Loads | Where-Object Place -eq 'own')) {
              Fail "$($run.Label) loaded $($load.Path) from its own folder, row $($load.Index), $(Get-When $load $read.Marker)."
            }

            # What the bundle extracted is every file in the folders its libraries were
            # loaded from under %TEMP%\.net. Those folders stay after the run, and the
            # second pass starts from them again.
            $extractionFolders = @($read.Loads | Where-Object Place -eq 'extraction' | ForEach-Object { Split-Path $_.Path } | Sort-Object -Unique)
            if ($run.Label -eq 'portable' -and -not $extractionFolders) {
              Fail "The portable loaded nothing from its extraction folder, so that folder went unchecked."
            }
            $bundleFiles = @(foreach ($folder in $extractionFolders) { Get-ChildItem -LiteralPath $folder -File | ForEach-Object FullName })

            # A plant goes at the path that was looked at. A look under %TEMP%\.net in a
            # folder that no longer exists once the run ends, the one the bundle writes
            # into before moving its files into place, is printed with its path.
            $plants = [System.Collections.Generic.List[object]]::new()
            $looks = @($read.Libraries | Where-Object { $_.Operation -ne 'Load Image' -and $_.Path -notmatch '[*?]' })
            foreach ($relative in ($looks | Where-Object Place -eq 'own' | ForEach-Object { $_.Relative.ToLowerInvariant() } | Sort-Object -Unique)) {
              $plant = Get-Plant (Split-Path $relative -Leaf) $read.Loads
              $plants.Add([pscustomobject]@{ Place = 'beside'; Path = $relative; Source = $plant.Source; Kind = $plant.Kind })
            }
            foreach ($path in ($looks | Where-Object Place -eq 'extraction' | ForEach-Object { $_.Path.ToLowerInvariant() } | Sort-Object -Unique)) {
              if (Test-Path -LiteralPath $path) { continue }
              if (-not (Test-Path -LiteralPath (Split-Path $path))) { "  looked under %TEMP%\.net in a folder gone after the run: $path"; continue }
              $plant = Get-Plant (Split-Path $path -Leaf) $read.Loads
              $plants.Add([pscustomobject]@{ Place = 'extraction'; Path = $path; Source = $plant.Source; Kind = $plant.Kind })
            }

            $alone = @($plants | Where-Object { $_.Place -eq 'beside' -and (Split-Path $_.Path -Leaf) -in $plantedAlone })
            $planned.Add([pscustomobject]@{
              Label = $run.Label; BuildLabel = $run.Label; JudgeOnLoadAlone = $false; BundleFiles = $bundleFiles
              Plants = @($plants | Where-Object { $_ -notin $alone })
            })
            foreach ($plant in $alone) {
              $planned.Add([pscustomobject]@{
                Label = "$($run.Label) with $(Split-Path $plant.Path -Leaf) alone"; BuildLabel = $run.Label; JudgeOnLoadAlone = $true
                BundleFiles = $bundleFiles; Plants = @($plant)
              })
            }
          }

          "== Planted for the second pass"
          foreach ($p in $planned) {
            "  $($p.Label):"
            foreach ($plant in $p.Plants) { "    $($plant.Place) $($plant.Path): $($plant.Kind), $($plant.Source)" }
          }
          ConvertTo-Json -InputObject @($planned) -Depth 5 | Set-Content (Join-Path $env:RUNNER_TEMP 'plants.json')

          Exit-IfFailed

      # A planted file is judged by whether the build loaded it, and a plant counts only
      # where a look found it in place and it was unchanged when the build ended, so a
      # plant that was missed, removed or rewritten cannot pass.
      - name: Second pass, with the genuine files planted
        if: ${{ !cancelled() && env.PROCMON != '' }}
        shell: pwsh
        run: |
          . (Join-Path $env:RUNNER_TEMP 'native.ps1')
          $plantsFile = Join-Path $env:RUNNER_TEMP 'plants.json'
          if (-not (Test-Path $plantsFile)) { throw "The first pass wrote nothing to plant." }
          $planned = @(Get-Content -Raw $plantsFile | ConvertFrom-Json)

          Start-Record 'second'
          $runs = foreach ($p in $planned) {
            $build = $builds | Where-Object Label -eq $p.BuildLabel
            $folder = Get-RunFolder 'second' $p.Label
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
            Copy-Item $build.Exe $folder
            $placed = [System.Collections.Generic.List[object]]::new()
            foreach ($plant in @($p.Plants | Where-Object { $_ })) {
              $path = if ($plant.Place -eq 'beside') { Join-Path $folder $plant.Path } else { $plant.Path }
              New-Item -ItemType Directory -Force -Path (Split-Path $path) | Out-Null
              Copy-Item -LiteralPath $plant.Source -Destination $path
              $placed.Add([pscustomobject]@{ Path = $path; Hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash })
            }
            $id = Invoke-Build $build $p.Label $folder
            [pscustomobject]@{
              Label = $p.Label; Build = $build; Folder = $folder; Exe = (Split-Path $build.Exe -Leaf); Id = $id
              Placed = $placed; BundleFiles = @($p.BundleFiles | Where-Object { $_ }); JudgeOnLoadAlone = $p.JudgeOnLoadAlone
            }
          }
          $byProcess = Read-Record (Stop-Record 'second') $runs

          foreach ($run in $runs) {
            $read = Read-Run $run $byProcess
            if (-not $read) { continue }
            # A native library is mapped and loaded; a managed one can be read instead, so
            # any of the three by the build counts as the planted file being taken.
            $placedPaths = @($run.Placed | ForEach-Object Path)
            $loadedPaths = @($read.Loads | ForEach-Object Path)
            foreach ($taken in ($read.Libraries | Where-Object { $_.Operation -in 'CreateFileMapping', 'ReadFile' -and $placedPaths -contains $_.Path -and $loadedPaths -notcontains $_.Path } | Group-Object Path)) {
              $first = $taken.Group[0]
              Fail "$($run.Label) read the planted $($first.Path), $($first.Operation) at row $($first.Index), $(Get-When $first $read.Marker)."
            }
            foreach ($load in $read.Loads) {
              if ($placedPaths -contains $load.Path) {
                Fail "$($run.Label) loaded the planted $($load.Path), row $($load.Index), $(Get-When $load $read.Marker)."
              }
              elseif ($load.Place -eq 'own' -or ($load.Place -eq 'extraction' -and $run.BundleFiles -notcontains $load.Path)) {
                Fail "$($run.Label) loaded $($load.Path), which neither its bundle nor the first pass put there, row $($load.Index), $(Get-When $load $read.Marker)."
              }
            }
            foreach ($plant in $run.Placed) {
              $at = @($read.Libraries | Where-Object { $_.Path -eq $plant.Path -and $_.Operation -ne 'Load Image' })
              $found = @($at | Where-Object { $_.Result -eq 'SUCCESS' -and $_.Operation -in 'QueryOpen', 'CreateFile' })
              if (-not $at) { Fail "$($run.Label) did not look for the planted $($plant.Path)." }
              elseif (-not $found) {
                Fail "The planted $($plant.Path) was not there when $($run.Label) looked: $(($at | ForEach-Object { "$($_.Operation) $($_.Result)" } | Sort-Object -Unique) -join ', ')."
              }
              if (-not (Test-Path -LiteralPath $plant.Path)) { Fail "The planted $($plant.Path) was gone once $($run.Label) ended." }
              elseif ((Get-FileHash -Algorithm SHA256 -LiteralPath $plant.Path).Hash -ne $plant.Hash) { Fail "The planted $($plant.Path) was changed while $($run.Label) ran." }
            }

            if ($run.JudgeOnLoadAlone) {
              "  judged without its must-loads: a build that takes a planted apphost library cannot start, so $($run.Label) is not expected to load $($run.Build.MustLoad -join ' or '). DOTNET_ROOT is $env:DOTNET_ROOT."
            }
            else { Test-MustLoad $run $read.Loads }
          }

          Exit-IfFailed

      # Each build is started once more with the .NET host's trace on, outside both
      # records so the trace's variables change nothing either pass saw. A genuine
      # hostfxr.dll is planted beside the slim, and DOTNET_ROOT and DOTNET_ROOT_X64 name a
      # decoy .NET install holding a copy of it under host\fxr. The slim's exe carries the
      # places its host searches for .NET, which the trace prints as a number made of
      # these: 1 the exe's own folder, 2 a folder relative to it, 4 the folder the
      # DOTNET_ROOT variables name, and 8 the location .NET's installer registers, or
      # .NET's default install folder where none is registered. 0 is the default search,
      # which includes the exe's folder. The job fails where the slim's number is missing
      # or anything but 8, and where its trace does not name the hostfxr.dll it loaded or
      # names one outside .NET's install. The slim is also published to search the
      # DOTNET_ROOT variables as well, from a copy of the commit of its own, and the job
      # fails where that build does not load the decoy's hostfxr.dll, which is what shows
      # the decoy is one the host takes. That build cannot find the desktop runtime under
      # the decoy and does not start, and its trace is all that is read. For every
      # build it prints the folders the runtime searches for native libraries; the
      # command line is started for its version, so its host and runtime start and it
      # scans nothing.
      - name: Trace how each build's host starts
        if: ${{ !cancelled() && env.PROCMON != '' }}
        shell: pwsh
        run: |
          . (Join-Path $env:RUNNER_TEMP 'native.ps1')
          # The second pass leaves its plants in place, and a start of the same bundle extracts
          # to the same folder under %TEMP%\.net, so the files planted there are removed first.
          $plantsFile = Join-Path $env:RUNNER_TEMP 'plants.json'
          if (Test-Path $plantsFile) {
            foreach ($p in @(Get-Content -Raw $plantsFile | ConvertFrom-Json)) {
              foreach ($plant in @($p.Plants | Where-Object { $_ -and $_.Place -eq 'extraction' -and (Test-Path -LiteralPath $_.Path) })) {
                Remove-Item -LiteralPath $plant.Path -Force -ErrorAction SilentlyContinue
                if (Test-Path -LiteralPath $plant.Path) { Fail "The planted $($plant.Path) could not be removed before the trace." }
                else { "  removed the planted $($plant.Path)" }
              }
            }
          }
          # The host reads the registered location from the registry's 32-bit view.
          $key = [Microsoft.Win32.RegistryKey]::OpenBaseKey('LocalMachine', 'Registry32').OpenSubKey('SOFTWARE\dotnet\Setup\InstalledVersions\x64')
          $registered = if ($key) { $key.GetValue('InstallLocation') }
          "  DOTNET_ROOT was '$env:DOTNET_ROOT', DOTNET_ROOT_X64 '$env:DOTNET_ROOT_X64'; the registered x64 install is '$registered'"
          $installed = if ($registered) { $registered } else { Join-Path $env:ProgramFiles 'dotnet' }
          # The newest host, by version: host\fxr holds one folder per installed version.
          $genuineFxr = @(Get-ChildItem -Path (Join-Path $installed 'host\fxr\*\hostfxr.dll') -ErrorAction SilentlyContinue |
            Sort-Object { $v = $null; if ([version]::TryParse(($_.Directory.Name -replace '-.*$'), [ref]$v)) { $v } else { [version]'0.0' } } |
            Select-Object -Last 1)
          if (-not $genuineFxr.Count) { throw "No hostfxr.dll under $installed to plant beside the slim." }

          # Published before the DOTNET_ROOT variables are set, so the publish runs as every
          # other does, and from a copy of the commit, so nothing a publish above left under
          # obj reaches it.
          $tree = Join-Path $env:RUNNER_TEMP 'dotnet-root-control'
          git archive --format=zip -o "$tree.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw "git archive failed for the slim that searches DOTNET_ROOT." }
          Expand-Archive -Path "$tree.zip" -DestinationPath $tree -Force
          dotnet publish (Join-Path $tree 'src/InstallerClean/InstallerClean.csproj') -c Release -r win-x64 -p:RestoreLockedMode=true -p:PublishSelfContained=false -p:SelfContained=false -p:PublishSingleFile=true -p:AppHostDotNetSearch=EnvironmentVariable%3BGlobal --nologo -o "$tree-publish"
          if ($LASTEXITCODE -ne 0) { throw "The slim that searches DOTNET_ROOT did not publish." }

          # The host takes the highest version folder under host\fxr, so the decoy's is named
          # as the genuine one is.
          $decoy = Join-Path $env:RUNNER_TEMP 'decoy-dotnet-root'
          $decoyFxr = Join-Path $decoy ('host\fxr\' + $genuineFxr[0].Directory.Name)
          New-Item -ItemType Directory -Force -Path $decoyFxr | Out-Null
          Copy-Item -LiteralPath $genuineFxr[0].FullName -Destination $decoyFxr
          $decoyFxr = $decoyFxr.TrimEnd('\') + '\'
          $env:DOTNET_ROOT = $decoy
          $env:DOTNET_ROOT_X64 = $decoy
          "  DOTNET_ROOT and DOTNET_ROOT_X64 name $decoy, which holds a copy of $($genuineFxr[0].FullName)"
          $env:DOTNET_HOST_TRACE = '1'
          foreach ($build in $builds) {
            $folder = Get-RunFolder 'trace' $build.Label
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
            Copy-Item $build.Exe $folder
            if ($build.Label -eq 'slim') {
              Copy-Item -LiteralPath $genuineFxr[0].FullName -Destination $folder
              "  planted $($genuineFxr[0].FullName) beside the slim"
            }
            $trace = "$folder.txt"
            $env:DOTNET_HOST_TRACEFILE = $trace
            # The command line's host and runtime start for --version, which then ends the run.
            $start = $build | Select-Object *
            if ($build.Label -eq 'command line') { $start.Arguments = @('--version') }
            $null = Invoke-Build $start $build.Label $folder
            if (-not (Test-Path $trace)) { Fail "$($build.Label) wrote no host trace."; continue }
            $lines = @(Get-Content $trace)
            Write-Host "== $($build.Label): $($lines.Count) trace lines"
            $lines | Where-Object { $_ -match '\.NET root search location options|registry value in|Found registered install location|as runtime location|Resolved fxr|Property NATIVE_DLL_SEARCH_DIRECTORIES' } |
              ForEach-Object { Write-Host "  $_" }
            if ($build.Label -eq 'slim') {
              $options = @($lines | ForEach-Object { if ($_ -match '\.NET root search location options: (\d+)') { [int]$Matches[1] } })
              if (-not $options.Count) { Fail "The slim's trace has no .NET root search location options line." }
              elseif ($options[0] -ne 8) { Fail "The slim's host searches for .NET beyond the registered or default install: search location options $($options[0])." }
              $fxr = @($lines | ForEach-Object { if ($_ -match 'Resolved fxr \[(.+)\]') { $Matches[1] } })
              $installedFxr = $installed.TrimEnd('\') + '\host\fxr\'
              if (-not $fxr.Count) { Fail "The slim's trace does not name the hostfxr.dll it loaded." }
              foreach ($path in $fxr) {
                if ($path.StartsWith($installedFxr, 'OrdinalIgnoreCase')) { "  the slim loaded $path, under $installedFxr" }
                else { Fail "The slim loaded $path, which is not under $installedFxr, with a hostfxr.dll planted in $folder and DOTNET_ROOT naming $decoy." }
              }
            }
          }

          $control = [pscustomobject]@{ Label = 'slim searching DOTNET_ROOT'; Exe = (Join-Path "$tree-publish" 'InstallerClean.exe'); Arguments = @(); Wait = 20 }
          $folder = Get-RunFolder 'trace' $control.Label
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item $control.Exe $folder
          $trace = "$folder.txt"
          $env:DOTNET_HOST_TRACEFILE = $trace
          # Without this the host shows a dialog saying the desktop runtime is missing.
          $env:DOTNET_DISABLE_GUI_ERRORS = '1'
          $null = Invoke-Build $control $control.Label $folder
          Remove-Item Env:DOTNET_DISABLE_GUI_ERRORS
          if (-not (Test-Path $trace)) { Fail "The $($control.Label) wrote no host trace, so the decoy is not shown to be one the host takes." }
          else {
            $fxr = @(Get-Content $trace | ForEach-Object { if ($_ -match 'Resolved fxr \[(.+)\]') { $Matches[1] } })
            if (@($fxr | Where-Object { $_.StartsWith($decoyFxr, 'OrdinalIgnoreCase') }).Count) { "  the $($control.Label) loaded $($fxr -join ', '), the decoy's" }
            else { Fail "The $($control.Label) loaded $(if ($fxr.Count) { $fxr -join ', ' } else { 'no hostfxr.dll its trace names' }), not the decoy's under $decoyFxr, so the decoy is not shown to be one the host takes." }
          }

          Exit-IfFailed

      # A copy updating itself starts the newer version with /startedevent:<id> and
      # puts itself back where that version has not set the event within 60 s. Every
      # build sets it once its own code is running: the command line as it takes its
      # arguments, a window once its splash is up and its services are built. So a build
      # that stops setting it is one no copy can update to. Each build is started here
      # from a folder of its own with the switch, and the step fails where the event is
      # not set within 60 s. The time each build took to set it is printed. The command
      # line is started for its version, so it scans nothing.
      #
      # A build given the switch that cannot set the event ends at once with exit code 1,
      # having run nothing, so the copy that started it puts itself back straight away.
      # Each build is started again with an id naming no event, the command line with /s so
      # that a build going on would scan, and the step fails where a build has not ended
      # within 60 s, ends with any other exit code, or, for the command line, prints anything.
      - name: Check each build says it has started
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $failed = @()
          $builds = @(
            @{ Label = 'command line'; Exe = 'publish/cli/installerclean-cli.exe'; Arguments = @('--version') },
            @{ Label = 'portable'; Exe = 'publish/self-contained/InstallerClean.exe'; Arguments = @() },
            @{ Label = 'slim'; Exe = 'publish/framework-dependent/InstallerClean.exe'; Arguments = @() }
          )
          foreach ($build in $builds) {
            $folder = Join-Path $env:RUNNER_TEMP ('started-' + ($build.Label -replace ' ', '-'))
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
            Copy-Item $build.Exe $folder
            $exe = Join-Path $folder (Split-Path $build.Exe -Leaf)
            $id = [guid]::NewGuid().ToString('N')
            $created = $false
            $started = [System.Threading.EventWaitHandle]::new($false, 'ManualReset', "Local\InstallerClean_Started_$id", [ref]$created)
            if (-not $created) { throw "An event named for $id exists already." }
            $clock = [System.Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $exe -ArgumentList (@($build.Arguments) + "/startedevent:$id") -WorkingDirectory $folder -PassThru
            # Read now, so the exit code is kept once the process ends.
            $null = $p.Handle
            $set = $started.WaitOne([TimeSpan]::FromSeconds(60))
            $clock.Stop()
            if ($set) { "  $($build.Label) set the event $([math]::Round($clock.Elapsed.TotalSeconds, 1)) s after it was started" }
            else {
              $ended = if ($p.HasExited) { "; it ended with exit code $($p.ExitCode)" } else { '' }
              $failed += "$($build.Label) did not set the event within 60 s$ended."
            }
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; $p.WaitForExit() }
            $started.Dispose()
          }
          foreach ($build in $builds) {
            $folder = Join-Path $env:RUNNER_TEMP ('started-' + ($build.Label -replace ' ', '-'))
            $exe = Join-Path $folder (Split-Path $build.Exe -Leaf)
            $id = [guid]::NewGuid().ToString('N')
            $isCli = $build.Label -eq 'command line'
            $arguments = @(if ($isCli) { '/s' }) + "/startedevent:$id"
            $output = Join-Path $folder 'no-event-output.txt'
            $errors = Join-Path $folder 'no-event-errors.txt'
            $p = if ($isCli) {
              Start-Process -FilePath $exe -ArgumentList $arguments -WorkingDirectory $folder -NoNewWindow -PassThru `
                -RedirectStandardOutput $output -RedirectStandardError $errors
            } else {
              Start-Process -FilePath $exe -ArgumentList $arguments -WorkingDirectory $folder -PassThru
            }
            $null = $p.Handle
            if (-not $p.WaitForExit(60000)) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; $p.WaitForExit()
              $failed += "$($build.Label), given an event that does not exist, was still running after 60 s."
              continue
            }
            $printed = if ($isCli) { ((Get-Content -Raw $output) + (Get-Content -Raw $errors)) } else { '' }
            if ($p.ExitCode -ne 1) { $failed += "$($build.Label), given an event that does not exist, ended with exit code $($p.ExitCode), not 1." }
            elseif ($printed) { $failed += "$($build.Label), given an event that does not exist, printed: $printed" }
            else { "  $($build.Label), given an event that does not exist, ended with exit code 1 and printed nothing" }
          }
          $failed | ForEach-Object { Write-Host "::error::$_" }
          if ($failed.Count) { exit 1 }

      # A start-up hook is an assembly .NET loads and runs before the app's own code,
      # named by DOTNET_STARTUP_HOOKS. A small one is built here that writes its process's
      # ID and path to the file another variable names. Each build is started from a
      # folder of its own with both variables set on its process alone, and so is each
      # build published again with start-up hooks allowed, from a copy of the commit of
      # its own. Every build is started with /startedevent:<id> and waited for until it
      # sets the event, the command line for its version, so it scans nothing; a build
      # that does not set it within 60 s fails the step, since whether a hook ran in it is
      # then not judged. The step fails where a shipped build ran the hook, and where an
      # allowing build did not by the time it set the event. Each allowing build's hook
      # line is printed. The builds are started with CreateProcess, which a window build
      # asking for administrator rights refuses with error 740 where the step is not
      # elevated.
      - name: Check no build runs a start-up hook
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $failed = @()

          $hookDir = Join-Path $env:RUNNER_TEMP 'startup-hook'
          New-Item -ItemType Directory -Force -Path $hookDir | Out-Null
          Set-Content -Path (Join-Path $hookDir 'StartupHook.csproj') -Value @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
            </PropertyGroup>
          </Project>
          '@
          Set-Content -Path (Join-Path $hookDir 'StartupHook.cs') -Value @'
          internal class StartupHook
          {
              public static void Initialize()
              {
                  var marker = System.Environment.GetEnvironmentVariable("STARTUP_HOOK_MARKER");
                  if (!string.IsNullOrEmpty(marker))
                      System.IO.File.AppendAllText(marker,
                          $"{System.Environment.ProcessId} {System.Environment.ProcessPath}{System.Environment.NewLine}");
              }
          }
          '@
          dotnet build (Join-Path $hookDir 'StartupHook.csproj') -c Release --nologo -o (Join-Path $hookDir 'out')
          if ($LASTEXITCODE -ne 0) { throw "The start-up hook did not build." }
          $hook = Join-Path $hookDir 'out\StartupHook.dll'
          if (-not (Test-Path $hook)) { throw "The start-up hook build wrote no $hook." }

          function Publish-Allowing([string]$name, [string]$project, [string[]]$options) {
            $tree = Join-Path $env:RUNNER_TEMP "hooks-allowed-$name"
            git archive --format=zip -o "$tree.zip" HEAD
            if ($LASTEXITCODE -ne 0) { throw "git archive failed for the $name with start-up hooks allowed." }
            Expand-Archive -Path "$tree.zip" -DestinationPath $tree -Force
            dotnet publish (Join-Path $tree $project) -c Release -r win-x64 -p:RestoreLockedMode=true @options -p:StartupHookSupport=true --nologo -o "$tree-publish"
            if ($LASTEXITCODE -ne 0) { throw "The $name with start-up hooks allowed did not publish." }
            "$tree-publish"
          }
          $selfContained = '--self-contained', 'true', '-p:PublishSingleFile=true', '-p:IncludeNativeLibrariesForSelfExtract=true', '-p:EnableCompressionInSingleFile=true'
          $cli = Publish-Allowing 'command-line' 'src/InstallerClean.Cli/InstallerClean.Cli.csproj' $selfContained
          $portable = Publish-Allowing 'portable' 'src/InstallerClean/InstallerClean.csproj' $selfContained
          $slim = Publish-Allowing 'slim' 'src/InstallerClean/InstallerClean.csproj' @('-p:PublishSelfContained=false', '-p:SelfContained=false', '-p:PublishSingleFile=true')

          $builds = @(
            [pscustomobject]@{ Label = 'command line'; Exe = 'publish/cli/installerclean-cli.exe'; Allowing = $false },
            [pscustomobject]@{ Label = 'portable'; Exe = 'publish/self-contained/InstallerClean.exe'; Allowing = $false },
            [pscustomobject]@{ Label = 'slim'; Exe = 'publish/framework-dependent/InstallerClean.exe'; Allowing = $false },
            [pscustomobject]@{ Label = 'command line with hooks allowed'; Exe = (Join-Path $cli 'installerclean-cli.exe'); Allowing = $true },
            [pscustomobject]@{ Label = 'portable with hooks allowed'; Exe = (Join-Path $portable 'InstallerClean.exe'); Allowing = $true },
            [pscustomobject]@{ Label = 'slim with hooks allowed'; Exe = (Join-Path $slim 'InstallerClean.exe'); Allowing = $true }
          )
          # One at a time, each ended and waited for before the next starts, since the
          # windows share the single-instance mutex.
          foreach ($build in $builds) {
            $folder = Join-Path $env:RUNNER_TEMP ('hook-' + ($build.Label -replace '[^A-Za-z0-9]+', '-'))
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
            Copy-Item $build.Exe $folder
            $exe = Join-Path $folder (Split-Path $build.Exe -Leaf)
            $marker = Join-Path $folder 'hook-ran.txt'
            Remove-Item -LiteralPath $marker -Force -ErrorAction SilentlyContinue
            $id = [guid]::NewGuid().ToString('N')
            $created = $false
            $started = [System.Threading.EventWaitHandle]::new($false, 'ManualReset', "Local\InstallerClean_Started_$id", [ref]$created)
            if (-not $created) { throw "An event named for $id exists already." }
            $info = [System.Diagnostics.ProcessStartInfo]::new($exe)
            $info.UseShellExecute = $false
            $info.WorkingDirectory = $folder
            if ($exe.EndsWith('installerclean-cli.exe', 'OrdinalIgnoreCase')) { $info.ArgumentList.Add('--version') }
            $info.ArgumentList.Add("/startedevent:$id")
            $info.Environment['DOTNET_STARTUP_HOOKS'] = $hook
            $info.Environment['STARTUP_HOOK_MARKER'] = $marker
            Write-Host "== $($build.Label)"
            try {
              $p = [System.Diagnostics.Process]::Start($info)
            }
            catch {
              $code = $_.Exception.InnerException.NativeErrorCode
              $why = if ($code -eq 740) { ', which asks for administrator rights the step does not have' } else { '' }
              $failed += "$($build.Label) could not be started: error $code$why."
              $started.Dispose()
              continue
            }
            $clock = [System.Diagnostics.Stopwatch]::StartNew()
            $set = $started.WaitOne([TimeSpan]::FromSeconds(60))
            $clock.Stop()
            $ranBySignal = Test-Path -LiteralPath $marker
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            $p.WaitForExit()
            $started.Dispose()
            $lines = @(if (Test-Path -LiteralPath $marker) { Get-Content -LiteralPath $marker })
            $own = @($lines | Where-Object { $_ -like "$($p.Id) *" })
            if (-not $set) { $failed += "$($build.Label) did not set the event within 60 s, so whether a hook ran in it is not judged."; continue }
            $after = "$([math]::Round($clock.Elapsed.TotalSeconds, 1)) s"
            if ($build.Allowing) {
              if (-not $own.Count) { $failed += "$($build.Label) ran no hook, so a shipped build running none shows nothing." }
              elseif (-not $ranBySignal) { $failed += "$($build.Label) ran the hook only after it set the event." }
              else { "  $($build.Label) set the event after $after, and the hook ran in it: $($own -join '; ')" }
            }
            elseif ($lines.Count) { $failed += "$($build.Label) ran the start-up hook DOTNET_STARTUP_HOOKS names: $($lines -join '; ')" }
            else { "  $($build.Label) set the event after $after, and no hook ran in it" }
          }
          $failed | ForEach-Object { Write-Host "::error::$_" }
          if ($failed.Count) { exit 1 }

      - name: Check no window left a report
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $left = @()
          foreach ($folder in (Join-Path $env:LOCALAPPDATA 'InstallerClean'), (Join-Path $env:LOCALAPPDATA 'NoFaff\InstallerClean')) {
            $report = Join-Path $folder 'last-run.json'
            if (Test-Path $report) { $left += "A window left a report waiting: $report." } else { "  no $report" }
            $settings = Join-Path $folder 'settings.json'
            if ((Test-Path $settings) -and ((Get-Content -Raw $settings) -match '"reportToSend"\s*:\s*true')) {
              $left += "A window marked a report to send in $settings."
            }
          }
          $left | ForEach-Object { Write-Host "::error::$_" }
          if ($left.Count) { exit 1 }
