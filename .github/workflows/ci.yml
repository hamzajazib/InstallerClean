name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the Dependabot relock job re-run these checks on the commit it pushes: a
  # commit pushed with the default GITHUB_TOKEN starts no workflow run of its own
  # (GitHub's anti-recursion rule), and workflow_dispatch is the documented
  # exception. Also usable as a manual re-run from the Actions tab.
  workflow_dispatch:

# Read-only, declared rather than inherited from the repository default. Every
# step below only reads: two pinned actions, the node guards, dotnet, a
# Chocolatey install and ISCC. Nothing here pushes, comments or uploads an
# artefact, and a job that restores from nuget.org and installs a package from
# the Chocolatey community feed is the one place a build-time dependency could
# reach for whatever token the run is holding.
permissions:
  contents: read

jobs:
  build-and-test:
    # Pinned rather than windows-latest so a GitHub image roll cannot redden an
    # unrelated push: that label moved from Server 2022 (VS2022) to Server 2025
    # (VS2026) on 2026-06-15, and an image change that breaks the build belongs
    # on a deliberate bump of this line rather than on GitHub's schedule.
    # windows-2022 is the fallback if the 2025 image regresses.
    runs-on: windows-2025

    steps:
      # fetch-depth: 0 for the superseded-English gate at the end of this job,
      # which compares every satellite value against every wording the neutral
      # resx has ever held, and so answers for exactly as much history as it is
      # given. The default fetch is one commit. That gate refuses to run in a
      # shallow clone rather than relying on this line, so removing the depth
      # turns the step red.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # EVERY STEP IN THIS JOB RUNS WHETHER OR NOT THE ONE BEFORE IT WENT RED, AND
      # THAT IS A DECISION RATHER THAN BOILERPLATE. Each guard below reads a
      # different part of the tree and none is a premise for any other: the resx
      # contract says nothing about XAML resource keys, and neither says anything
      # about whether the app builds. Without the condition the first red step
      # decides what the rest of the job is allowed to measure, so one guard going
      # red takes every verdict behind it with it and a run carrying several
      # faults reports one. A red step still fails the job. It just no longer
      # speaks for the steps it happens to stand in front of.

      # Source-level satellite contract: key presence, stray keys and {N}
      # placeholder arity across every Strings.<code>.resx. The compiled-
      # resource side is covered by SatelliteResxParityTests in the test run.
      - name: Check resx satellite parity
        if: success() || failure()
        run: node scripts/check-resx-parity.mjs

      # Strings.Designer.cs is hand-regenerated, so it can drift from the neutral
      # resx silently: an accessor whose key has been removed still compiles, and
      # Get() falls back to returning the key, so the first sign is a raw key on
      # screen.
      - name: Check Strings.Designer.cs is in step
        if: success() || failure()
        run: node scripts/check-designer-parity.mjs

      # Source-level drift guards, each pinned to a concrete failure the app has
      # actually hit: a resx key left with no consumer; the installer language
      # set and SupportedLanguages diverging when a language is added to one and
      # not the other. These need only the checkout, not the SDK, so they run
      # before it and report a source fault in seconds rather than after a build.
      - name: Check for dead resx keys
        if: success() || failure()
        run: node scripts/check-dead-resx-keys.mjs

      - name: Check installer language list
        if: success() || failure()
        run: node scripts/check-installer-languages.mjs

      # The two lists of counted strings, compared at the source because a
      # switch's arms are not enumerable at runtime. The script says why.
      - name: Check the counted-string inventory
        if: success() || failure()
        run: node scripts/check-counted-string-inventory.mjs

      # Directory.Build.props and the two app.manifest identities, checked here
      # rather than only at release time: the manifests are build inputs, so
      # after a release has built its binaries the fix costs a rebuild and every
      # hash it was scanned under.
      - name: Check version surfaces agree
        if: success() || failure()
        run: node scripts/check-version-surfaces.mjs

      # The level both hosts ask for decides what the scan concludes about a
      # per-user product it would not be entitled to see, so it is checked with
      # the other build inputs rather than left to whoever next opens a manifest.
      - name: Check both hosts ask for administrator
        if: success() || failure()
        run: node scripts/check-elevation-manifest.mjs

      # Two guards read built files, so neither can be picked up with the
      # check-*.mjs glob that runs before the build. Each is invoked by name
      # instead, the artefact guard in both workflows and the native-imports
      # check in this one. This is what holds those lines in place.
      - name: Check the guards that read built files are still wired in
        if: success() || failure()
        run: node scripts/check-guard-wiring.mjs

      # A French value that lost its narrow no-break space to a plain space,
      # which plenty of editors do silently.
      - name: Lint French spacing
        if: success() || failure()
        run: node scripts/check-french-spacing.mjs

      # Program.cs prints each line of a Cli.Help.* value with Console.WriteLine and
      # wraps nothing, so a translated line over the console's column budget is torn
      # across two rows with the second hard against the left margin. It sits with
      # the source guards rather than with the gates at the end: a language over the
      # budget is a mistake in the string, not a translation still to be done.
      - name: Check CLI help fits its column budget
        if: success() || failure()
        run: node scripts/check-cli-help-width.mjs

      # The check above holds how wide a help line may be; this one holds where the
      # description column of the command rows starts. The column is per-language,
      # set by that language's longest installerclean-cli prefix, since a translated
      # metavariable is not the width of PATH, so each language is compared with
      # itself. A translation round that reflags some rows and leaves others
      # translated puts the two at different columns with every value correct read
      # on its own. A row still holding the neutral's English is left to
      # check-still-english rather than measured. It sits with the source guards for
      # the same reason as the width check.
      - name: Check CLI help columns line up
        if: success() || failure()
        run: node scripts/check-cli-help-alignment.mjs

      # Two faults with one trigger. A {StaticResource} whose key nothing defines,
      # and one whose resource is of a type the consuming property cannot take,
      # both compile clean and both throw when the template is first realised,
      # which is when a user opens that window. Neither the build nor the test
      # run below sees either, because resource lookup happens at neither.
      - name: Check XAML resource keys and types
        if: success() || failure()
        run: node scripts/check-xaml-resources.mjs

      # Text takes its font from the root it is drawn under, a window or a
      # tooltip or menu popup, and a root without the app's font draws a styled
      # TextBlock or a TextBox in the system font. Nothing fails when that
      # happens: the window opens and the line is in the wrong typeface.
      - name: Check every window and popup carries the app font
        if: success() || failure()
        run: node scripts/check-xaml-font.mjs

      # A character missing from the font a language is drawn in is drawn from
      # the next font in its list, in another typeface, and a bundled font with
      # other vertical metrics changes the height of every line drawn in it.
      # Nothing fails when either happens: the window opens with a word or a
      # line that does not match the rest. The fonts for Chinese, Japanese and
      # Korean are read from this runner's Windows Fonts folder.
      - name: Check every language's text is in the font it is drawn in
        if: success() || failure()
        run: node scripts/check-font-coverage.mjs

      # A production caller may pass the action services an empty set of claims and
      # the compiler cannot see it: the argument is required, so passing the wrong
      # value satisfies it. The under-lease re-read then returns a pass at its first
      # line without having asked anything. The tests below drive the call sites that
      # exist; this is what fails on the day somebody writes a new one.
      - name: Check the under-lease claims reach the action services
        if: success() || failure()
        run: node scripts/check-under-lease-claims.mjs

      # An Application-channel value is machine-read and is built in en-GB at the
      # write site, whatever the machine's language. This fails where a test
      # composes one outside MachineContract.English or MachineContract.WriteEventLog,
      # where it takes the language the test runs in. It prints every reference it
      # finds, in scope or not.
      - name: Check the tests compose machine-contract values in scope
        if: success() || failure()
        run: node scripts/check-machine-contract-scope.mjs

      # A Debug build reads switches a developer sets on their own PC, and a Release
      # build must not contain them. This fails where a switch's name, or a read of
      # the environment the script does not list, sits outside #if DEBUG; where a
      # project file, a response file or a workflow defines DEBUG outside the Debug
      # configuration; and where a publish in release.yml names a configuration other
      # than Release. It prints every name, read and definition it finds, and stops
      # where a switch's own name or read is not found.
      - name: Check the Debug-only switches stay out of Release builds
        if: success() || failure()
        run: node scripts/check-debug-only-switches.mjs

      # Every step in this job carries the same condition, for the reason set
      # out at the first guard: no step here is a premise for any other, so a
      # red one reports its own verdict and decides nothing about the rest.
      - name: Setup .NET SDK
        if: success() || failure()
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # NuGet Audit runs during restore and reports a vulnerable package as a
      # warning; -warnaserror turns that into a failed step. `dotnet list package
      # --vulnerable` exits 0 while printing a high-severity advisory, so a step
      # built on it stays green on a vulnerable package. NuGetAuditMode=all is
      # explicit because an advisory can arrive through a transitive package as
      # well as a direct one.
      #
      # Keep this ahead of anything that restores. Restore is idempotent and
      # silent on a second call: after a build it prints "All projects are
      # up-to-date for restore" and emits no NU190x at all, so a step placed there
      # stays green over a graph nobody audited.
      - name: Fail on a vulnerable package
        if: success() || failure()
        run: dotnet restore src/InstallerClean.sln -p:RestoreLockedMode=true -p:NuGetAuditMode=all -warnaserror:NU1901,NU1902,NU1903,NU1904

      - name: Build
        if: success() || failure()
        run: dotnet build src/InstallerClean/InstallerClean.csproj -p:RestoreLockedMode=true

      - name: Build CLI
        if: success() || failure()
        run: dotnet build src/InstallerClean.Cli/InstallerClean.Cli.csproj -p:RestoreLockedMode=true

      # The tests set en-GB for themselves, culture and UI culture alike
      # (src/InstallerClean.Tests/AssemblyInfo.cs). This prints the runner's own
      # culture and UI culture, the two that setting takes the place of.
      - name: Print the runner's culture
        if: success() || failure()
        shell: pwsh
        run: |
          $culture = [System.Globalization.CultureInfo]::CurrentCulture
          $ui = [System.Globalization.CultureInfo]::CurrentUICulture
          "Culture:    $(if ($culture.Name) { $culture.Name } else { 'invariant' })"
          "UI culture: $(if ($ui.Name) { $ui.Name } else { 'invariant' })"

      - name: Test
        if: success() || failure()
        run: dotnet test src/InstallerClean.Tests/ -p:RestoreLockedMode=true

      # A build reports a broken reference in a documentation comment only when
      # it writes the documentation file, which no project here asks for. This
      # build asks for it and fails on every documentation warning except the
      # three that ask for more documentation: CS1591, CS1573 and CS1712. It
      # fails on CS1570 and CS1587 as well as on the reference warnings, because
      # the compiler resolves no reference inside a comment that is badly formed
      # or is not on a member, so a broken reference there shows up only as one
      # of those two. --no-incremental makes the compiler run whatever was built
      # before this step: an incremental build skips the compiler for a project
      # whose outputs are current, and a skipped compile reports nothing.
      - name: Check documentation comments
        if: success() || failure()
        run: dotnet build src/InstallerClean.sln --no-incremental -p:RestoreLockedMode=true -p:GenerateDocumentationFile=true -warnaserror:CS0419,CS1570,CS1571,CS1572,CS1574,CS1580,CS1581,CS1584,CS1587,CS1589,CS1590,CS1592,CS1658,CS1710,CS1711,CS1723,CS1734,CS1735,CS8018 -nowarn:CS1591,CS1573,CS1712

      # Everything from here to the setup compile depends on the BUILD having
      # succeeded, not on the tests having passed, and a red test run is precisely
      # when somebody wants to know that the downloads still publish and that the
      # .iss still compiles. Carrying no condition, all of them were skipped by a
      # red Test, which is how a reorder that put the language gates last still left
      # the .iss having never been compiled anywhere.
      - name: Smoke-publish self-contained
        if: success() || failure()
        run: dotnet publish src/InstallerClean/InstallerClean.csproj -c Release -r win-x64 --self-contained true -p:RestoreLockedMode=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish/self-contained

      # PublishSelfContained=false is what disables the .NET 8+ rule
      # "PublishSingleFile=true implies SelfContained=true". --self-contained false
      # sets the other property and .NET 10 no longer takes it, so both are passed
      # here: with the first alone, a publish comes out in the self-contained shape
      # under a framework-dependent name, tens of times the size it should be. The
      # flags below are the release script's own (dotnet/sdk#52070), which is what
      # makes this a smoke test of the shape that ships rather than a second copy
      # of the step above it.
      - name: Smoke-publish framework-dependent
        if: success() || failure()
        run: dotnet publish src/InstallerClean/InstallerClean.csproj -c Release -r win-x64 -p:RestoreLockedMode=true -p:PublishSelfContained=false -p:SelfContained=false -p:PublishSingleFile=true -o publish/framework-dependent

      - name: Smoke-publish CLI framework-dependent
        if: success() || failure()
        run: dotnet publish src/InstallerClean.Cli/InstallerClean.Cli.csproj -c Release -r win-x64 -p:RestoreLockedMode=true -p:PublishSelfContained=false -p:SelfContained=false -p:PublishSingleFile=true -o publish/cli-framework-dependent

      # publish/cli is where installer/InstallerClean.iss reads the CLI from, so
      # it holds the self-contained single-file build: that is the shape the
      # release script puts there and the shape the shipped setup embeds. The
      # framework-dependent publish above parks beside it and exercises the
      # lighter build without deciding what the compile step below bundles.
      #
      # Compression ON is the default and the preferred shape: it roughly halves
      # a download whose whole audience is people wary of what they are running,
      # and size is the one thing a wary reader judges before opening anything.
      # Dropping it is a FALLBACK, taken per release and only on evidence, when a
      # scan flags the compressed build and the uncompressed build of the same
      # source comes back clean. That fallback has fired once, for the 2.3.0
      # standalone CLI, and it does not carry forward: each release starts from
      # compressed and earns its way off. Whichever shape a release ships, this
      # flag must match the release script's, because the README tells readers
      # they can rebuild a tag and compare hashes and this file is the only
      # public statement of how.
      - name: Smoke-publish CLI self-contained
        if: success() || failure()
        run: dotnet publish src/InstallerClean.Cli/InstallerClean.Cli.csproj -c Release -r win-x64 --self-contained true -p:RestoreLockedMode=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish/cli

      # Reads the four bundles above, framework included, and fails where our code
      # can reach a Windows library by a search no resolver of ours answers: a call
      # into framework code that ends at one of CoreLib's ole32 or oleaut32 imports,
      # a P/Invoke outside InstallerClean.Interop.Native, an unlisted NativeLibrary
      # call, a package added or importing a new library, or a reference to
      # System.Net.Quic. The script says what each check reads and builds the planted
      # assembly every check must catch.
      - name: Check what the builds' code can reach in Windows libraries
        if: success() || failure()
        shell: pwsh
        run: ./scripts/check-native-imports.ps1

      # Here rather than with the other guards because it reads the three
      # published files, which do not exist until the steps above have run. A
      # satellite that never reaches an artefact leaves the source resx present
      # and correct, so every guard that reads the tree passes and the window
      # opens in English on a machine set to that language.
      - name: Check the built artefacts carry every satellite assembly and ask for administrator
        if: success() || failure()
        run: node scripts/verify-shipped-artefacts.mjs

      # ISCC is the only thing that reads installer/*.iss, so a typo there shows
      # up nowhere else. Compiling the setup here finds it on the push that
      # caused it rather than on the release machine. The self-contained GUI
      # and CLI publishes above put the exes exactly where the [Files] section
      # looks for them, in the shapes the release script builds, so this
      # compiles the real setup rather than a stub. Repointing either at a
      # different publish directory quietly turns it back into one.
      #
      # The compile step fails on any warning ISCC prints, as well as on a
      # failed compile. A message missing from one language's .isl is a warning
      # and no more: the compile goes on, and that language's wizard shows the
      # text from another language in its place, English for a [Messages] entry
      # and the first language that defines it for a [CustomMessages] one. ISCC
      # prints each warning at the end of the compile as a line starting
      # "Warning: ", and writes no such line under /Q or /Qp, so either option
      # on the command line below lets a missing message through. Setting
      # MissingMessagesWarning=no in the script's [Setup] section does the same
      # for a [Messages] entry, by turning that warning off at the source.
      #
      # The version is pinned for the same reason the runner is: an Inno release
      # must not redden an unrelated push. 6.7.1 is the compiler that built the
      # shipped 2.0.x setups, and it is the one the bundled "Inno Setup 6.5.0+"
      # community .isl files are known to compile against. Bump it deliberately.
      # Conditioned with the compile below rather than left to the default: ISCC
      # is not on the runner image, so a compile step that runs past a red Test
      # while its installer step did not fails on a missing ISCC.exe and reports
      # nothing about the .iss.
      - name: Install Inno Setup
        if: success() || failure()
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Compile the installer
        if: success() || failure()
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}" -Filter ISCC.exe -Recurse -Depth 1 -ErrorAction SilentlyContinue |
                  Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "ISCC.exe not found under ${env:ProgramFiles(x86)} after installing Inno Setup." }
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version |
                     Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw "Could not read <Version> from Directory.Build.props." }
          & $iscc "/DAppVersion=$version" installer\InstallerClean.iss | Tee-Object -Variable compileOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $warnings = @($compileOutput | Where-Object { $_ -like 'Warning: *' })
          if ($warnings.Count -gt 0) {
            ''
            'ISCC printed these warnings, and any warning fails this step:'
            $warnings
            exit 1
          }

      # The seven language gates run last, and each runs even when one before it
      # has failed. Every one is named below, because a gate left out of the list
      # gets read as deliberate by default.
      #
      # FOUR HOLD THE SATELLITES IN STEP WITH THE ENGLISH, so each goes red when
      # a string in the neutral resx moves and the satellites, or the pages built
      # from them, have not yet followed: check-still-english, on a satellite
      # value that is still the English neutral; check-translation-freshness, on
      # a ledger entry recording a translation made against an English the
      # neutral has since replaced, or standing on a key the satellite or the
      # neutral no longer holds; the generator reproduction check, whose diff
      # catches a satellite the generators would now write differently and whose
      # TEMPLATE OK holds a template the reworded neutral has left behind; and
      # gen-translation-table --check, whose pages are generated from the resx.
      #
      # THREE ARE EXPECTED GREEN AT ALL TIMES and their red means a mistake:
      # check-accelerators, check-cross-key-rules and check-superseded-english.
      # The last reads the satellites too, but a satellite holding a wording the
      # English has ABANDONED is never a state a translation is on its way to
      # producing.
      #
      # They sit after the build and the test run, so a red language gate never
      # stops either of those from running. Each runs under !cancelled(), so one
      # red gate does not hide the ones after it, and unlike always() it stands
      # down on a cancelled job instead of posting a failure for every gate left.
      # Nothing is softened by the position: a failure here fails the job exactly
      # as one at the top does.

      # The premise every resx guard in this job rests on: each Strings.<code>.resx
      # is a byte-reproducible artefact of its generator in scripts/translations/.
      # All of them read the resx, so a value hand-edited there and not into its
      # generator passes every one and is reverted by whoever next runs the loop.
      # That has happened once. The generators are tracked now and CONTRIBUTING.md
      # sends translators straight at them.
      #
      # The diff holds reproducibility. TEMPLATE OK holds the template, which
      # writes no satellite for a diff to catch and which flag-retranslation.mjs
      # skips by name, so a reworded neutral leaves it holding the old English.
      # The satellites' own verdict lines are deliberately not read: they say
      # "still English (untranslated)" for every key awaiting a translation
      # round, which is what check-still-english below holds, and a generator's
      # exit code does not follow them. What it does follow is the parse control,
      # which stops the generator before it writes anything, so the loop below
      # keeps every generator's status rather than only the last one's.
      - name: Check every satellite reproduces from its generator
        if: '!cancelled()'
        shell: bash
        run: |
          # Each generator's status is kept as the loop goes. A command
          # substitution around the whole loop carries only the last one's, so
          # all but the last would have nowhere to report from.
          #
          # The check on them runs before the diff because a generator that stops
          # early leaves its satellite untouched, so the diff has nothing to say
          # about the one language that did not run.
          log=
          stopped=
          for g in scripts/translations/gen-strings-*.mjs; do
            out=$(node "$g") || stopped="$stopped $(basename "$g")"
            log="$log$out"$'\n'
          done
          echo "$log"
          if [ -n "$stopped" ]; then
            echo "Generators that did not finish:$stopped" >&2
            exit 1
          fi
          git diff --exit-code -- src/InstallerClean.Core/Resources
          # A case rather than a pipe into grep: the runner sets pipefail, and a
          # grep that exits on its first match can leave the echo feeding it
          # killed by SIGPIPE, which would fail this step over a log that said
          # the right thing.
          case "$log" in
            *"TEMPLATE OK"*) ;;
            *)
              echo "gen-strings-template.mjs did not report TEMPLATE OK; its output is above." >&2
              exit 1
              ;;
          esac

      - name: Check the access-key sets for a clash
        if: '!cancelled()'
        # Two controls live on one window at one moment must not share an Alt
        # access key: WPF answers a duplicate by cycling focus between the
        # matches instead of invoking either, so a clash silently retires BOTH,
        # in one language, on the route only a keyboard or screen-reader user
        # takes. An eye-verify pass runs in a single language and reads the
        # English accelerator, so nothing but this sees it.
        run: node scripts/check-accelerators.mjs

      # The rules that live BETWEEN two strings, or between a string and the
      # code that shows it: a spoken name against its visible label, a sentence
      # against the button it quotes, the installer-folder token, a window title
      # whose only consumer overwrites it. Every other check here holds one key's
      # structure or one key's sameness across files, so none of them can see a
      # rule of that shape, and the About window's donate button consequently
      # showed one phrase and spoke another in two languages across four
      # releases.
      #
      # A red naming a language is a fix in that language's generator under
      # scripts/translations/, never a hand-edit of the resx the message names.
      # Rules 7 and 8 fault the XAML and the C# instead and carry their own
      # instruction, which is what the script's closing footer is gated on.
      - name: Check cross-key rules
        if: '!cancelled()'
        run: node scripts/check-cross-key-rules.mjs

      # A required gate: a satellite shipping the English neutral for a
      # required key fails the build. Expected to fail on the commits between a
      # string's English landing and its translation round running, rather than
      # only on a mistake.
      - name: Check no satellite value is still the English
        if: '!cancelled()'
        run: node scripts/check-still-english.mjs

      # A different question from check-still-english's, and the two divide the
      # subject between them. That gate compares a satellite value against the
      # CURRENT neutral; this one compares it against every wording the neutral
      # has ever held, which is what identifies a value holding English the app
      # has since replaced. Comparing against a history means it answers for
      # exactly as much of one as it is given, so it needs the full fetch the
      # checkout at the top of this job asks for, and refuses to run without it.
      #
      # A hard gate rather than a translation-window one: a satellite holding a
      # wording the app has ABANDONED is not a state the translation pass is on
      # its way to producing. The script's own header sets out why that leaves it
      # with no false positives to trade against.
      - name: Check no satellite holds superseded English
        if: '!cancelled()'
        run: node scripts/check-superseded-english.mjs

      # The one thing about a translation nothing else asks: whether it has
      # fallen behind its English. Still-English fires when a satellite value
      # equals the CURRENT neutral, the gate above when it equals a FORMER one,
      # resx parity compares key presence and numeric placeholder arity, and
      # cross-key rules enforce named tokens. A satellite holding a TRANSLATION
      # of the previous English of a rewritten key matches nothing any of them
      # compares it against.
      #
      # IT ANSWERS FROM A LEDGER, so what it can say depends on what the ledger
      # carries. A key-slot the ledger holds is reported and fails the build once
      # the English has moved past it. So does an entry the English gives
      # nothing to measure against, such as one for a key taken out of it, and
      # so does one for a language with no satellite. A key-slot outside the
      # ledger is named in a NOTE line and is one the run makes no claim about.
      - name: Check translations against the freshness ledger
        if: '!cancelled()'
        run: node scripts/check-translation-freshness.mjs

      # docs/translations/*.md carry the same "generated, never hand-edited"
      # contract as the resx guards above. They are the pages the translation
      # feedback issue template and CONTRIBUTING.md point native speakers at, so
      # a stale one asks for corrections to text that no longer exists.
      - name: Check translation review tables are in step
        if: '!cancelled()'
        run: node scripts/gen-translation-table.mjs --check

  # The four packages.lock.json files are the project's only statement of what
  # is in the shipped binary closure, and every restore in the job above is
  # windows-2025, where System.Diagnostics.EventLog resolves out of the Desktop
  # shared framework whether the lock lists it or not. A lock that has lost it
  # therefore restores clean on Windows and fails NU1004 on Linux, so the job
  # above cannot see that gap and this restore is the one that can.
  #
  # A separate job rather than a step, because the one above is pinned to
  # windows-2025 and this has to run somewhere else. It reads the same locks
  # from the same checkout and writes nothing.
  #
  # It gates nothing on its own: branch protection requires build-and-test and
  # Analyse C# by name, so this has to be added there before a red one can stop
  # a merge. Until it is, the log is the whole of it.
  lock-files:
    name: Lock files (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore in locked mode
        run: dotnet restore src/InstallerClean.sln -p:EnableWindowsTargeting=true -p:RestoreLockedMode=true


  # Where each shipped build loads the Windows libraries it uses from. The app runs
  # elevated, and a portable or slim copy is often run from a Downloads folder, so a
  # library it would load from its own folder is one a file dropped there would
  # replace. Each build is published with release.yml's flags and run in two passes,
  # with Process Monitor recording every file the build's process opens or probes. The
  # command line runs twice in each pass: once to scan with /noupdate, and once to scan
  # after checking for updates, which reaches its network code.
  #
  # The first pass runs each build from an empty folder of its own and notes every
  # .dll it looked for there, and every one it looked for under %TEMP%\.net, where a
  # single-file build extracts itself. The second pass runs each build again with a
  # file of each of those names planted at the path that was looked at: one the build
  # loaded under that name in the first pass, else System32's, else, where no file on
  # the runner carries the name, a small System32 library under it. The job fails where
  # a build loaded, mapped or read a planted file, where no look found a planted file in
  # place, and where one had changed by the time the build ended.
  #
  # Some Windows libraries the .NET runtime inside the command line and the portable looks
  # for in their own folders, before System32, on behalf of System.Private.CoreLib's
  # imports or of WPF's own start-up, which no resolver or setting the app makes can send
  # elsewhere. Those looks are listed in the first pass's step by exe, the runs that make
  # them, the folder, the library and the assembly that asks for it, and nothing is
  # planted for a listed look that passes the first pass's check. Any other look, in any
  # run, is planted as any other. The first pass prints each listed look with the row of
  # its first look in each run, reads the assembly from the runtime pack the exe's bundle
  # names, and fails where a listed library is not spelled as that assembly asks for it,
  # where no run of the exe looked for it, and, for one listed as looked for before the
  # build's own code runs, where its first look in a run came after the first act of that
  # code the job can see, or no act was seen.
  #
  # In either pass the job also fails where a build loaded a library from its own
  # folder, and in the second where it loaded one under %TEMP%\.net that its bundle did
  # not extract in the first. The files planted under %TEMP%\.net are removed as the
  # first act of the step that traces each build's start. A hostfxr.dll or hostpolicy.dll
  # planted beside a build runs on its own, since the apphost reads those before the
  # runtime starts and taking one can stop the build starting at all.
  #
  # Every look is printed with its full path, its place among the process's rows, and
  # whether it came after the first act of the build's own code that Process Monitor
  # can see. Each build names that act: in the slim, its module initializer loading the
  # first assembly on its list from the installed runtime's folder; in the command line,
  # Main's look for the exe's old copy beside it; in the portable, its look for the
  # app's folder under %LOCALAPPDATA%. The first pass fails where a build shows another
  # first, or none, and where a build started with nothing planted writes to its crash
  # log.
  #
  # It refuses to pass on a run that saw nothing: Process Monitor has to have started
  # and recorded each build's process, the command line has to have loaded msi.dll
  # for its scan, and each window has to have loaded dwmapi.dll and WPF's
  # wpfgfx_cor3.dll, which it does only once it creates a window, so a window that
  # could not open on the runner fails the job. A run with an apphost library planted
  # alone is the exception and is judged without its must-loads. The command line's run
  # that checks for updates has to have loaded winhttp.dll and had an answer from
  # github.com, and fails where the Application log shows it updated itself or found a
  # newer release it did not install.
  #
  # Every Windows library a .NET or WPF assembly imports is loaded from System32 by the
  # resolver in FrameworkLibraries.cs, which hands the libraries on its OwnLibraries
  # list back to the runtime. The job fails where the portable's bundle extracts a
  # library that list does not name, where a framework assembly in a folder the slim's
  # runtime searches imports a native library there that the list does not name, and
  # where the list names one those folders do not carry. The window loads before its
  # Main the Windows Forms assemblies the installed desktop runtime adds, where the host
  # lists them as trusted platform assemblies, so the job fails where the slim's host
  # trace does not list them, where the portable's lists one of them or an assembly its
  # bundle carries, and where the slim does not load them before the first act seen of
  # its code in Main or later.
  #
  # The slim's exe finds .NET only where .NET is installed, so the job fails where the
  # first pass sees the slim look for hostfxr.dll or hostpolicy.dll in its own folder.
  # After both passes each build is started once more with the .NET host's trace on,
  # with a hostfxr.dll planted beside the slim and a decoy .NET install named by
  # DOTNET_ROOT. The job fails where that trace shows the slim's exe searching for .NET
  # anywhere but the registered or default install, or loading a hostfxr.dll from
  # anywhere else, and where a slim published to search only the DOTNET_ROOT variables
  # does not carry that search or does not load the decoy's. It prints the folders each
  # build's runtime searches for native libraries.
  #
  # Then each build is started with the switch a copy updating itself passes the
  # newer version, and the job fails where the build does not say within 60 s that its
  # own code is running.
  #
  # Then each build is started with a start-up hook named by DOTNET_STARTUP_HOOKS,
  # and so is each published again with start-up hooks allowed. The job fails where a
  # shipped build runs the hook, where an allowing build does not, and where any build
  # does not say within 60 s that its own code is running.
  #
  # A window started on a fresh account offers to send a report. Before any build
  # runs, the PC-wide first-run mark is set, so the offer is never made, and the
  # report receiver's host is pointed nowhere in the hosts file. The job fails where
  # either window left a report behind.
  #
  # Last, the setup is compiled from the builds the job published and run from a
  # folder of its own under both passes, as a download is run. The setup, the
  # setup.tmp it starts and anything that starts are judged on the images they load
  # from their own folders, and the setup on the files planted beside it.
  #
  # Each pass's Process Monitor rows for every process named as one of the builds'
  # exes and for the setup's processes, each host trace and the app's crash logs are
  # kept with the run for seven days, whether or not the job passed.
  native-libraries:
    name: Native libraries (Windows)
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Publish the three builds as release.yml does
        run: |
          dotnet publish src/InstallerClean.Cli/InstallerClean.Cli.csproj -c Release -r win-x64 --self-contained true -p:RestoreLockedMode=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --nologo -o publish/cli
          if ($LASTEXITCODE -ne 0) { throw "The command line did not publish." }
          dotnet publish src/InstallerClean/InstallerClean.csproj -c Release -r win-x64 --self-contained true -p:RestoreLockedMode=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --nologo -o publish/self-contained
          if ($LASTEXITCODE -ne 0) { throw "The portable did not publish." }
          dotnet publish src/InstallerClean/InstallerClean.csproj -c Release -r win-x64 -p:RestoreLockedMode=true -p:PublishSelfContained=false -p:SelfContained=false -p:PublishSingleFile=true --nologo -o publish/framework-dependent
          if ($LASTEXITCODE -ne 0) { throw "The slim did not publish." }

      # FirstRunRecorded under HKLM\SOFTWARE\NoFaff\InstallerClean is the mark a
      # window reads to decide this PC has run InstallerClean before, and with it set
      # no report is offered or saved. The hosts entry stops anything reaching the
      # receiver even so.
      #
      # The name is resolved before the entry is written and has to come back with a
      # real address, so the check after it is reading a resolver that answers. With
      # the entry in place the lookup passes where it returns no address other than
      # 0.0.0.0 and ::, or none at all, including as the HostNotFound or NoData that
      # GetHostAddresses throws for a name with no address. Any other address, or any
      # other error, fails the step.
      - name: Keep the windows from sending a report
        shell: pwsh
        run: |
          New-Item -Path 'HKLM:\SOFTWARE\NoFaff\InstallerClean' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\NoFaff\InstallerClean' -Name FirstRunRecorded -PropertyType DWord -Value 1 -Force | Out-Null
          $mark = (Get-ItemProperty 'HKLM:\SOFTWARE\NoFaff\InstallerClean').FirstRunRecorded
          if ($mark -ne 1) { throw "The first-run mark was not set." }

          $receiver = 'nofaff.netlify.app'
          $nowhere = '0.0.0.0', '::'
          try {
            $before = @([System.Net.Dns]::GetHostAddresses($receiver) | ForEach-Object { $_.ToString() })
          }
          catch {
            throw "The lookup of $receiver before the hosts entry is written failed: $($_.Exception.Message)"
          }
          if (-not @($before | Where-Object { $_ -notin $nowhere }).Count) {
            throw "$receiver resolves to $(if ($before.Count) { $before -join ', ' } else { 'no address' }) before the hosts entry is written."
          }

          $hosts = Join-Path $env:SystemRoot 'System32\drivers\etc\hosts'
          $entries = $nowhere | ForEach-Object { "$_ $receiver" }
          Add-Content -Path $hosts -Value ("`r`n" + ($entries -join "`r`n"))
          $written = @(Get-Content $hosts)
          foreach ($entry in $entries) {
            if ($written -notcontains $entry) { throw "The hosts file does not hold '$entry'." }
          }
          ipconfig /flushdns | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "ipconfig /flushdns failed with $LASTEXITCODE, so the lookup below could read $receiver's address from before the hosts entry." }

          $lookupError = $null
          try {
            $after = @([System.Net.Dns]::GetHostAddresses($receiver) | ForEach-Object { $_.ToString() })
          }
          catch {
            $lookupError = $_.Exception
            while ($lookupError -and $lookupError -isnot [System.Net.Sockets.SocketException]) { $lookupError = $lookupError.InnerException }
            if (-not $lookupError) { throw "The lookup of $receiver with the hosts entry in place failed: $($_.Exception.Message)" }
            if ($lookupError.SocketErrorCode -notin 'HostNotFound', 'NoData') {
              throw "The lookup of $receiver with the hosts entry in place did not finish: $($lookupError.SocketErrorCode)."
            }
            $after = @()
          }
          $elsewhere = @($after | Where-Object { $_ -notin $nowhere })
          if ($elsewhere.Count) { throw "$receiver still resolves to $($elsewhere -join ', ') with the hosts entry in place." }
          $answer = if ($after.Count) { $after -join ', ' } elseif ($lookupError) { "no address ($($lookupError.SocketErrorCode))" } else { 'no address' }
          "  first-run mark set; $receiver resolved to $($before -join ', ') before the hosts entry and to $answer after it"

      # The steps after this one that record or judge a build dot-source native.ps1,
      # which defines the builds and then dot-sources scripts/native-libraries.ps1.
      - name: Get Process Monitor and name the builds the later steps run
        shell: pwsh
        run: |
          . (Join-Path $env:GITHUB_WORKSPACE 'scripts/native-libraries.ps1')
          $procmon = Get-Procmon (Join-Path $env:RUNNER_TEMP 'procmon')
          "PROCMON=$procmon" | Add-Content $env:GITHUB_ENV

          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'native.ps1') -Value @'
          $builds = @(
            [pscustomobject]@{ Label = 'command line'; Exe = 'publish/cli/installerclean-cli.exe'; Source = 'src/InstallerClean.Cli/LibrarySearch.cs'; Arguments = @('/s', '/noupdate'); Wait = 60; MustLoad = @('msi.dll'); Marker = 'old copy' },
            [pscustomobject]@{ Label = 'command line, checking for updates'; Exe = 'publish/cli/installerclean-cli.exe'; Source = 'src/InstallerClean.Cli/LibrarySearch.cs'; Arguments = @('/s'); Wait = 60; MustLoad = @('msi.dll', 'winhttp.dll'); UpdateCheck = $true; Marker = 'old copy' },
            [pscustomobject]@{ Label = 'portable'; Exe = 'publish/self-contained/InstallerClean.exe'; Source = 'src/InstallerClean/LibrarySearch.cs'; Arguments = @(); Wait = 20; MustLoad = @('dwmapi.dll', 'wpfgfx_cor3.dll'); Marker = 'app folder' },
            [pscustomobject]@{ Label = 'slim'; Exe = 'publish/framework-dependent/InstallerClean.exe'; Source = 'src/InstallerClean/LibrarySearch.cs'; Arguments = @(); Wait = 20; MustLoad = @('dwmapi.dll', 'wpfgfx_cor3.dll'); Marker = 'module initializer' }
          )

          . (Join-Path $env:GITHUB_WORKSPACE 'scripts/native-libraries.ps1')
          '@

      # Each exe loads, before its Main, every assembly its self-contained build carries that
      # imports a Windows library, so each has its resolver before any thread of the app's
      # can use it. The list is LibrarySearch.ImportingAssemblies in each exe's project, and
      # this step recomputes it from the exe's self-contained bundle and the runtime packs it
      # was built from: the assemblies the exe references, directly or through others, that
      # the bundle carries and that import a library not on FrameworkLibraries.OwnLibraries,
      # less those left for their own load to register, plus those the app loads by name.
      # It fails on any difference, naming it. The slim runs the window's exe on the
      # installed desktop runtime, which also carries Windows Forms assemblies the portable
      # leaves out. The window loads those of them that import a Windows library from a
      # second list, ImportingAssembliesWhereInstalled, which this step recomputes as what
      # the runtime packs reach beyond what the bundle carries, and fails on any difference
      # there too. The command line has no second list, so its packs must reach no assembly
      # beyond its bundle that imports a Windows library.
      #
      # Left for their own load to register: System.Drawing.Common, whose being loaded WPF
      # reads (WindowsBase's MS.Internal.AssemblyHelper) to decide how it handles
      # System.Drawing types; and the ribbon and Windows Forms hosting assemblies, which
      # add their types to the XAML namespace the window's markup uses. WPF reads four more
      # assemblies the same way, and the step fails where one of them comes to import a
      # Windows library, so whether to load it is decided rather than inherited. It also
      # fails where an assembly on a list declares types into that XAML namespace, other
      # than WPF's own three, which every window loads before its markup is read.
      - name: Check each exe's list of assemblies it loads first
        shell: pwsh
        run: |
          . (Join-Path $env:RUNNER_TEMP 'native.ps1')
          $cache = Get-NuGetCache
          $presentation = 'http://schemas.microsoft.com/winfx/2006/xaml/presentation'
          $wpfReads = 'System.Drawing.Common', 'System.Private.Xml', 'System.Private.Xml.Linq', 'System.Data.Common', 'System.Linq.Expressions'
          $exes = @(
            [pscustomobject]@{ Label = 'window'; Bundle = 'publish/self-contained/InstallerClean.exe'; Assembly = 'src/InstallerClean/bin/Release/net10.0-windows/win-x64/InstallerClean.dll'
              Source = 'src/InstallerClean/LibrarySearch.cs'; LeftToTheirLoad = @('System.Drawing.Common'); ByName = @('UIAutomationClient', 'UIAutomationClientSideProviders') }
            [pscustomobject]@{ Label = 'command line'; Bundle = 'publish/cli/installerclean-cli.exe'; Assembly = 'src/InstallerClean.Cli/bin/Release/net10.0/win-x64/installerclean-cli.dll'
              Source = 'src/InstallerClean.Cli/LibrarySearch.cs'; LeftToTheirLoad = @()
              ByName = @('Microsoft.VisualBasic.Core', 'System.Formats.Tar', 'System.IO.Pipes', 'System.Net.HttpListener', 'System.Net.Ping', 'System.Text.Encoding.CodePages', 'System.Transactions.Local') }
          )
          $own = @(Get-OwnLibraries)

          # The XAML namespaces an assembly declares its types into.
          function Read-XmlnsDefinitions([string]$path) {
            $stream = [IO.File]::OpenRead($path)
            try {
              $md = [System.Reflection.Metadata.PEReaderExtensions]::GetMetadataReader([System.Reflection.PortableExecutable.PEReader]::new($stream))
              foreach ($handle in $md.GetAssemblyDefinition().GetCustomAttributes()) {
                $attribute = $md.GetCustomAttribute($handle)
                $type = switch ($attribute.Constructor.Kind) {
                  'MemberReference' {
                    $parent = $md.GetMemberReference([System.Reflection.Metadata.MemberReferenceHandle]$attribute.Constructor).Parent
                    if ($parent.Kind -eq 'TypeReference') { $md.GetString($md.GetTypeReference([System.Reflection.Metadata.TypeReferenceHandle]$parent).Name) }
                  }
                  'MethodDefinition' {
                    $md.GetString($md.GetTypeDefinition($md.GetMethodDefinition([System.Reflection.Metadata.MethodDefinitionHandle]$attribute.Constructor).GetDeclaringType()).Name)
                  }
                }
                if ($type -eq 'XmlnsDefinitionAttribute') {
                  $blob = $md.GetBlobReader($attribute.Value)
                  $null = $blob.ReadUInt16()
                  $blob.ReadSerializedString()
                }
              }
            }
            finally { $stream.Dispose() }
          }

          # Every assembly reached from $root through the references of those $index holds and,
          # where $carried is given, the bundle carries, with those of them that import a
          # library not on OwnLibraries, and the names reached that could not be followed.
          function Get-Reached($index, [string]$root, $carried) {
            $seen = [System.Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
            $pending = [System.Collections.Generic.Queue[string]]::new()
            $pending.Enqueue($root)
            $importing = [System.Collections.Generic.SortedSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
            $absent = [System.Collections.Generic.List[string]]::new()
            while ($pending.Count) {
              $name = $pending.Dequeue()
              if (-not $seen.Add($name)) { continue }
              if (-not $index.ContainsKey($name) -or ($null -ne $carried -and -not $carried.Contains($name))) { $absent.Add($name); continue }
              $stream = [IO.File]::OpenRead($index[$name])
              try {
                $md = [System.Reflection.Metadata.PEReaderExtensions]::GetMetadataReader([System.Reflection.PortableExecutable.PEReader]::new($stream))
                foreach ($handle in $md.AssemblyReferences) { $pending.Enqueue($md.GetString($md.GetAssemblyReference($handle).Name)) }
              }
              finally { $stream.Dispose() }
              if ($name -in $root, 'System.Private.CoreLib', 'InstallerClean.Core') { continue }
              $windows = @((Read-Imports $index[$name]).Imports | Where-Object { (Get-BaseName $_) -notin $own })
              if ($windows) { $null = $importing.Add($name) }
            }
            [pscustomobject]@{ Seen = $seen; Importing = $importing; Absent = $absent }
          }

          foreach ($exe in $exes) {
            "== $($exe.Label)"
            if (-not (Test-Path -LiteralPath $exe.Assembly)) { throw "$($exe.Assembly) is not there to read the $($exe.Label)'s references from." }
            $folders = foreach ($pack in @(Read-RuntimePacks $exe.Bundle)) {
              $folder = Join-Path $cache "$($pack.Name.ToLowerInvariant()).runtime.win-x64/$($pack.Version)/runtimes/win-x64/lib/net10.0"
              if (-not (Test-Path -LiteralPath $folder)) { throw "NuGet's cache does not hold $folder, the $($pack.Name) runtime pack the $($exe.Label) was built from." }
              Write-Host "  built from the $($pack.Name) runtime pack $($pack.Version)"
              $folder
            }
            $folders = @($folders) + (Split-Path $exe.Assembly)
            $carried = Read-BundleAssemblies $exe.Bundle
            Write-Host "  the bundle carries $($carried.Count) assemblies"
            # Where two packs carry an assembly of one name, as the .NET pack carries small
            # stand-ins for WindowsBase and Microsoft.VisualBasic, the build takes the one of
            # higher version, and so does this.
            $index = @{}
            $versions = @{}
            foreach ($folder in $folders) {
              foreach ($file in (Get-ChildItem -LiteralPath $folder -Filter '*.dll' -File)) {
                $version = try { [Reflection.AssemblyName]::GetAssemblyName($file.FullName).Version } catch [BadImageFormatException] { continue }
                if (-not $index.ContainsKey($file.BaseName) -or $version -gt $versions[$file.BaseName]) {
                  $index[$file.BaseName] = $file.FullName
                  $versions[$file.BaseName] = $version
                }
              }
            }

            # What the exe references, walked twice: through the assemblies its bundle
            # carries, for the list loaded in every build, and through everything its runtime
            # packs carry, which is what the installed runtime offers the slim.
            $root = [IO.Path]::GetFileNameWithoutExtension($exe.Assembly)
            $index[$root] = (Resolve-Path -LiteralPath $exe.Assembly).Path
            $bundled = Get-Reached $index $root $carried
            $installed = Get-Reached $index $root $null
            if ($bundled.Importing.Count -eq 0) { throw "No assembly the $($exe.Label) references imports a Windows library, so the walk read nothing." }
            $seen = $bundled.Seen
            $importing = $bundled.Importing
            "  references $($seen.Count) assemblies; the build carries none of: $($bundled.Absent -join ', ')"
            "  on the installed runtime, references $($installed.Seen.Count) assemblies; the packs carry none of: $($installed.Absent -join ', ')"

            # Where the exe has a list of assemblies it loads where installed, a name it leaves
            # for their own load may be one only the installed runtime carries; otherwise it is
            # one its bundle carries.
            $reached = if (@(Read-SourceList $exe.Source 'ImportingAssembliesWhereInstalled' -optional).Count) { $installed.Importing } else { $importing }
            foreach ($name in $exe.LeftToTheirLoad) {
              if (-not $reached.Contains($name)) { Fail "The $($exe.Label) leaves $name for its own load to register, and no assembly it references that imports a Windows library is called that." }
            }
            foreach ($name in $wpfReads) {
              if ($installed.Importing.Contains($name) -and $name -notin $exe.LeftToTheirLoad) {
                Fail "$name, whose being loaded WPF reads, now imports a Windows library and is referenced by the $($exe.Label): decide whether it is loaded first or left for its own load to register."
              }
            }
            $byName = [System.Collections.Generic.List[string]]::new()
            foreach ($name in $exe.ByName) {
              if ($seen.Contains($name)) { Fail "The $($exe.Label) names $name as loaded by name, and it is among the assemblies it references." }
              elseif (-not $index.ContainsKey($name)) { Fail "The $($exe.Label) names $name as loaded by name, and its runtime packs do not carry it." }
              elseif (-not $carried.Contains($name)) { Fail "The $($exe.Label) names $name as loaded by name, and its bundle does not carry it." }
              elseif (-not @((Read-Imports $index[$name]).Imports | Where-Object { (Get-BaseName $_) -notin $own })) { Fail "The $($exe.Label) names $name as loaded by name, and it imports no Windows library." }
              else { $byName.Add($name) }
            }

            $lists = @(
              [pscustomobject]@{
                Name = 'ImportingAssemblies'; Required = $true
                Expected = @($importing | Where-Object { $_ -notin $exe.LeftToTheirLoad }) + @($byName)
                Missing = 'which imports a Windows library'
              }
              [pscustomobject]@{
                Name = 'ImportingAssembliesWhereInstalled'; Required = $false
                Expected = @($installed.Importing | Where-Object { -not $importing.Contains($_) -and $_ -notin $exe.LeftToTheirLoad })
                Missing = 'which imports a Windows library and which the installed runtime carries and its bundle does not'
              }
            )
            $allListed = [System.Collections.Generic.List[string]]::new()
            foreach ($list in $lists) {
              $expected = [System.Collections.Generic.SortedSet[string]]::new([string[]]$list.Expected, [StringComparer]::OrdinalIgnoreCase)
              $listed = [System.Collections.Generic.SortedSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
              foreach ($name in @(Read-SourceList $exe.Source $list.Name -optional:(-not $list.Required))) { $null = $listed.Add($name) }
              "  $($list.Name): $($listed.Count) listed, $($expected.Count) computed"
              foreach ($name in $expected) { if (-not $listed.Contains($name)) { Fail "The $($exe.Label) can load $name, $($list.Missing), and $($exe.Source) does not list it in $($list.Name)." } }
              foreach ($name in $listed) { if (-not $expected.Contains($name)) { Fail "$($exe.Source) lists $name in $($list.Name), and it is not an assembly the $($exe.Label) can load $($list.Missing)." } }
              $allListed.AddRange([string[]]@($listed))
            }
            foreach ($name in $allListed) {
              if ($name -in 'PresentationCore', 'PresentationFramework', 'WindowsBase' -or -not $index.ContainsKey($name)) { continue }
              if (@(Read-XmlnsDefinitions $index[$name]) -contains $presentation) {
                Fail "$($exe.Source) lists $name, which declares types into the XAML namespace the window's markup uses, so loading it first changes how that markup is read."
              }
            }
          }

          Exit-IfFailed

      # First the plants are worked out over records made up for the purpose, and the job
      # fails unless each look for a file to load beside a build is planted for, each for
      # data is not, a load of a planted file fails, and a look recorded under a short name
      # is read in full or fails (Test-ImageNameControls and Test-ShortNameControls in
      # native-libraries.ps1).
      - name: First pass, with nothing planted
        shell: pwsh
        run: |
          . (Join-Path $env:RUNNER_TEMP 'native.ps1')
          Test-ImageNameControls
          Test-ShortNameControls
          "  interactive: $([Environment]::UserInteractive); session $((Get-Process -Id $PID).SessionId)"
          $runtimes = dotnet --list-runtimes
          $runtimes
          if (-not ($runtimes | Where-Object { $_ -match '^Microsoft\.WindowsDesktop\.App 10\.' })) {
            throw "No .NET 10 Desktop Runtime is installed, so the slim cannot start."
          }

          $notPlanted = @(Select-NotPlanted @(Get-NotPlanted) $builds)

          $listedSeen = @{}

          Start-Record 'first'
          $runs = foreach ($build in $builds) {
            $folder = Get-RunFolder 'first' $build.Label
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
            Copy-Item $build.Exe $folder
            $started = Get-Date
            $id = Invoke-Build $build $build.Label $folder
            $ended = Get-Date
            [pscustomobject]@{ Label = $build.Label; Build = $build; Folder = $folder; Exe = (Split-Path $build.Exe -Leaf); Id = $id; Started = $started; Ended = $ended }
          }
          $byProcess = Read-Record (Stop-Record 'first') $runs

          $planned = [System.Collections.Generic.List[object]]::new()
          foreach ($run in $runs) {
            $read = Read-Run $run $byProcess
            if (-not $read) { continue }
            Test-MustLoad $run $read.Loads
            if ($run.Build.UpdateCheck) { Test-UpdateCheck $run $byProcess }
            # A build whose first act seen is not the kind it names is judged against a later
            # row than its own code's start, so it fails rather than passing on that row.
            if (-not $read.Marker) { Fail "$($run.Label) showed no act of its own code." }
            elseif ($read.Marker.Kind -ne $run.Build.Marker) { Fail "$($run.Label)'s first act of its own code seen is the $($read.Marker.Kind) at row $($read.Marker.Index), where it should be the $($run.Build.Marker)." }
            # The slim runs on the installed desktop runtime, which lists these as trusted
            # platform assemblies, so its module initializer loads each before its Main: before
            # the first act seen of its code in Main or later.
            if ($run.Label -eq 'slim') {
              if (-not $read.MainMarker) { Fail "The slim showed no act of its code in Main or later, so whether it loads these before its Main was not judged." }
              foreach ($name in @(Get-WhereInstalled)) {
                $load = @($read.Loads | Where-Object Name -eq "$name.dll".ToLowerInvariant()) | Select-Object -First 1
                if (-not $load) { Fail "The slim never loaded $name.dll, which it loads before its Main where the installed runtime carries it." }
                elseif (-not $read.MainMarker) { "  loaded $name.dll at row $($load.Index): $($load.Path)" }
                elseif ($load.Index -gt $read.MainMarker.Index) { Fail "The slim loaded $name.dll at row $($load.Index), not before the first act seen of its code in Main or later, where it loads it before its Main." }
                else { "  loaded $name.dll at row $($load.Index), before row $($read.MainMarker.Index), the $($read.MainMarker.Kind): $($load.Path)" }
              }
            }
            # Each exe writes to the crash log whatever fails as it starts, such as an
            # assembly on its list that will not load, so a build started with nothing
            # planted writes nothing there. The app also writes to it to add an earlier
            # folder's log to its own, which on a runner that never held an earlier version
            # is as wrong as an entry.
            $crashLogPattern = '\\AppData\\Local\\(' + (($crashLogFolders | ForEach-Object { [regex]::Escape($_) }) -join '|') + ')\\crash\.log$'
            $rows = $byProcess[[string]$run.Id]
            $writes = @(for ($i = 0; $i -lt $rows.Count; $i++) {
              if ($rows[$i].Operation -eq 'WriteFile' -and $rows[$i].Path -match $crashLogPattern) { $i + 1 }
            })
            if ($writes) { Fail "$($run.Label) made $($writes.Count) WriteFile rows to its crash log with nothing planted, the first at row $($writes[0]): $($rows[$writes[0] - 1].Path)." }
            foreach ($name in $plantedAlone) {
              $beside = @($read.Libraries | Where-Object { $_.Place -eq 'own' -and $_.Operation -ne 'Load Image' -and $_.Relative -eq $name })
              "  looked for $name beside itself: $(if ($beside) { "yes, from row $($beside[0].Index)" } else { 'no' })"
              if ($beside -and $run.Label -eq 'slim') {
                $who = if ($name -eq 'hostfxr.dll') { "so its exe searches that folder for .NET" } else { "where hostfxr.dll looked for it" }
                Fail "The slim looked for $name in the folder it was run from, row $($beside[0].Index), $who."
              }
            }
            foreach ($load in ($read.Loads | Where-Object Place -eq 'own')) {
              Fail "$($run.Label) loaded $($load.Path) from its own folder, row $($load.Index), $(Get-When $load $read.Marker)."
            }

            # What the bundle extracted is every file in the folders its libraries were
            # loaded from under %TEMP%\.net. Those folders stay after the run, and the
            # second pass starts from them again.
            $extractionFolders = @($read.Loads | Where-Object Place -eq 'extraction' | ForEach-Object { Split-Path $_.Path } | Sort-Object -Unique)
            if ($run.Label -eq 'portable' -and -not $extractionFolders) {
              Fail "The portable loaded nothing from its extraction folder, so that folder went unchecked."
            }
            $bundleFiles = @(foreach ($folder in $extractionFolders) { Get-ChildItem -LiteralPath $folder -File | ForEach-Object FullName })
            # A library the bundle extracts is one a framework assembly may import, and the
            # resolver hands only those in OwnLibraries back to the runtime.
            $own = @(Get-OwnLibraries)
            foreach ($file in $bundleFiles) {
              if ((Get-BaseName (Split-Path $file -Leaf)) -notin $own) {
                Fail "$($run.Label)'s bundle extracted $file, which FrameworkLibraries.OwnLibraries does not name, so an import of it is sent to System32."
              }
            }

            $plants = @(Get-RunPlants $run $read $notPlanted $listedSeen $extractionFolders)

            $alone = @($plants | Where-Object { $_.Place -eq 'beside' -and (Split-Path $_.Path -Leaf) -in $plantedAlone })
            $planned.Add([pscustomobject]@{
              Label = $run.Label; BuildLabel = $run.Label; JudgeOnLoadAlone = $false; BundleFiles = $bundleFiles
              Plants = @($plants | Where-Object { $_ -notin $alone })
            })
            foreach ($plant in $alone) {
              $planned.Add([pscustomobject]@{
                Label = "$($run.Label) with $(Split-Path $plant.Path -Leaf) alone"; BuildLabel = $run.Label; JudgeOnLoadAlone = $true
                BundleFiles = $bundleFiles; Plants = @($plant)
              })
            }
          }

          Test-ListedSeen $notPlanted $listedSeen

          "== Planted for the second pass"
          foreach ($p in $planned) {
            "  $($p.Label):"
            foreach ($plant in $p.Plants) { "    $($plant.Place) $($plant.Path): $($plant.Kind), $($plant.Source)" }
          }
          ConvertTo-Json -InputObject @($planned) -Depth 5 | Set-Content (Join-Path $env:RUNNER_TEMP 'plants.json')

          # The builds write to the same crash logs in both passes, so a copy of each taken
          # now holds the first pass's entries alone. They go into the artifact.
          foreach ($folder in $crashLogFolders) {
            $crashLog = Join-Path $env:LOCALAPPDATA "$folder\crash.log"
            if (-not (Test-Path -LiteralPath $crashLog)) { continue }
            $kept = Join-Path $env:RUNNER_TEMP 'kept'
            New-Item -ItemType Directory -Force -Path $kept | Out-Null
            $name = if ($folder -eq 'InstallerClean') { 'crash-after-first-pass.log' } else { 'nofaff-crash-after-first-pass.log' }
            Copy-Item -LiteralPath $crashLog -Destination (Join-Path $kept $name)
            "  kept $crashLog as it stood after the first pass"
          }

          Exit-IfFailed

      # A planted file is judged by whether the build loaded it, and a plant counts only
      # where a look found it in place and it was unchanged when the build ended, so a
      # plant that was missed, removed or rewritten cannot pass.
      - name: Second pass, with the genuine files planted
        if: ${{ !cancelled() && env.PROCMON != '' }}
        shell: pwsh
        run: |
          . (Join-Path $env:RUNNER_TEMP 'native.ps1')
          $plantsFile = Join-Path $env:RUNNER_TEMP 'plants.json'
          if (-not (Test-Path $plantsFile)) { throw "The first pass wrote nothing to plant." }
          $planned = @(Get-Content -Raw $plantsFile | ConvertFrom-Json)

          Start-Record 'second'
          $runs = foreach ($p in $planned) {
            $build = $builds | Where-Object Label -eq $p.BuildLabel
            $folder = Get-RunFolder 'second' $p.Label
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
            Copy-Item $build.Exe $folder
            $placed = @(Add-Plants $folder $p.Plants)
            $started = Get-Date
            $id = Invoke-Build $build $p.Label $folder
            $ended = Get-Date
            [pscustomobject]@{
              Label = $p.Label; Build = $build; Folder = $folder; Exe = (Split-Path $build.Exe -Leaf); Id = $id; Started = $started; Ended = $ended
              Placed = $placed; BundleFiles = @($p.BundleFiles | Where-Object { $_ }); JudgeOnLoadAlone = $p.JudgeOnLoadAlone
            }
          }
          $byProcess = Read-Record (Stop-Record 'second') $runs

          foreach ($run in $runs) {
            $read = Read-Run $run $byProcess
            if (-not $read) { continue }
            Test-PlantedRun $run $read

            if ($run.JudgeOnLoadAlone) {
              "  judged without its must-loads: a build that takes a planted apphost library cannot start, so $($run.Label) is not expected to load $($run.Build.MustLoad -join ' or '). DOTNET_ROOT is $env:DOTNET_ROOT."
            }
            else {
              Test-MustLoad $run $read.Loads
              if ($run.Build.UpdateCheck) { Test-UpdateCheck $run $byProcess }
            }
          }

          Exit-IfFailed

      # Each build is started once more with the .NET host's trace on, outside both
      # records so the trace's variables change nothing either pass saw. A genuine
      # hostfxr.dll is planted beside the slim, and DOTNET_ROOT and DOTNET_ROOT_X64 name a
      # decoy .NET install holding a copy of it under host\fxr. The slim's exe carries the
      # places its host searches for .NET, which the trace prints as a number made of
      # these: 1 the exe's own folder, 2 a folder relative to it, 4 the folder the
      # DOTNET_ROOT variables name, and 8 the location .NET's installer registers, or
      # .NET's default install folder where none is registered. 0 is the default search,
      # which includes the exe's folder. The job fails where the slim's number is missing
      # or anything but 8, and where its trace does not name the hostfxr.dll it loaded or
      # names one outside .NET's install. The slim is also published to search only the
      # DOTNET_ROOT variables, from a copy of the commit of its own, and the job fails
      # where that build does not load the decoy's hostfxr.dll, which is what shows the
      # decoy is one the host takes. That build cannot find the desktop runtime under the
      # decoy and does not start, and its trace is all that is read. The job also fails
      # where that build's search location options are missing or anything but 4, the value
      # for the DOTNET_ROOT variables alone. For every build whose runtime starts it prints
      # the folders the runtime searches for native libraries; the command line is started
      # for its version, so its host and runtime start and it scans nothing.
      - name: Trace how each build's host starts
        if: ${{ !cancelled() && env.PROCMON != '' }}
        shell: pwsh
        run: |
          . (Join-Path $env:RUNNER_TEMP 'native.ps1')
          # The second pass leaves its plants in place, and a start of the same bundle extracts
          # to the same folder under %TEMP%\.net, so the files planted there are removed first.
          $plantsFile = Join-Path $env:RUNNER_TEMP 'plants.json'
          if (Test-Path $plantsFile) {
            foreach ($p in @(Get-Content -Raw $plantsFile | ConvertFrom-Json)) {
              foreach ($plant in @($p.Plants | Where-Object { $_ -and $_.Place -eq 'extraction' -and (Test-Path -LiteralPath $_.Path) })) {
                Remove-Item -LiteralPath $plant.Path -Force -ErrorAction SilentlyContinue
                if (Test-Path -LiteralPath $plant.Path) { Fail "The planted $($plant.Path) could not be removed before the trace." }
                else { "  removed the planted $($plant.Path)" }
              }
            }
          }
          # The host reads the registered location from the registry's 32-bit view.
          $key = [Microsoft.Win32.RegistryKey]::OpenBaseKey('LocalMachine', 'Registry32').OpenSubKey('SOFTWARE\dotnet\Setup\InstalledVersions\x64')
          $registered = if ($key) { $key.GetValue('InstallLocation') }
          "  DOTNET_ROOT was '$env:DOTNET_ROOT', DOTNET_ROOT_X64 '$env:DOTNET_ROOT_X64'; the registered x64 install is '$registered'"
          $installed = if ($registered) { $registered } else { Join-Path $env:ProgramFiles 'dotnet' }
          # The newest host, by version: host\fxr holds one folder per installed version.
          $genuineFxr = @(Get-ChildItem -Path (Join-Path $installed 'host\fxr\*\hostfxr.dll') -ErrorAction SilentlyContinue |
            Sort-Object { $v = $null; if ([version]::TryParse(($_.Directory.Name -replace '-.*$'), [ref]$v)) { $v } else { [version]'0.0' } } |
            Select-Object -Last 1)
          if (-not $genuineFxr.Count) { throw "No hostfxr.dll under $installed to plant beside the slim." }

          # Published before the DOTNET_ROOT variables are set, so the publish runs as every
          # other does, and from a copy of the commit, so nothing a publish above left under
          # obj reaches it.
          $tree = Join-Path $env:RUNNER_TEMP 'dotnet-root-control'
          git archive --format=zip -o "$tree.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw "git archive failed for the slim that searches DOTNET_ROOT." }
          Expand-Archive -Path "$tree.zip" -DestinationPath $tree -Force
          dotnet publish (Join-Path $tree 'src/InstallerClean/InstallerClean.csproj') -c Release -r win-x64 -p:RestoreLockedMode=true -p:PublishSelfContained=false -p:SelfContained=false -p:PublishSingleFile=true -p:AppHostDotNetSearch=EnvironmentVariable --nologo -o "$tree-publish"
          if ($LASTEXITCODE -ne 0) { throw "The slim that searches DOTNET_ROOT did not publish." }

          # The host takes the highest version folder under host\fxr, so the decoy's is named
          # as the genuine one is.
          $decoy = Join-Path $env:RUNNER_TEMP 'decoy-dotnet-root'
          $decoyFxr = Join-Path $decoy ('host\fxr\' + $genuineFxr[0].Directory.Name)
          New-Item -ItemType Directory -Force -Path $decoyFxr | Out-Null
          Copy-Item -LiteralPath $genuineFxr[0].FullName -Destination $decoyFxr
          $decoyFxr = $decoyFxr.TrimEnd('\') + '\'
          $env:DOTNET_ROOT = $decoy
          $env:DOTNET_ROOT_X64 = $decoy
          "  DOTNET_ROOT and DOTNET_ROOT_X64 name $decoy, which holds a copy of $($genuineFxr[0].FullName)"
          $env:DOTNET_HOST_TRACE = '1'
          # The trace lines printed for every build the step starts.
          $shown = '\.NET root search location options|registry value in|Found registered install location|as runtime location|Resolved fxr|Property NATIVE_DLL_SEARCH_DIRECTORIES'
          foreach ($build in $builds) {
            # The trace shows how a build's host starts, which a second run of the same exe
            # repeats.
            if ($build.UpdateCheck) { continue }
            $folder = Get-RunFolder 'trace' $build.Label
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
            Copy-Item $build.Exe $folder
            if ($build.Label -eq 'slim') {
              Copy-Item -LiteralPath $genuineFxr[0].FullName -Destination $folder
              "  planted $($genuineFxr[0].FullName) beside the slim"
            }
            $trace = "$folder.txt"
            $env:DOTNET_HOST_TRACEFILE = $trace
            # The command line's host and runtime start for --version, which then ends the run.
            $start = $build | Select-Object *
            if ($build.Label -eq 'command line') { $start.Arguments = @('--version') }
            $null = Invoke-Build $start $build.Label $folder
            if (-not (Test-Path $trace)) { Fail "$($build.Label) wrote no host trace."; continue }
            $lines = @(Get-Content $trace)
            Write-Host "== $($build.Label): $($lines.Count) trace lines"
            $lines | Where-Object { $_ -match $shown } | ForEach-Object { Write-Host "  $_" }

            # The window loads the assemblies on its ImportingAssembliesWhereInstalled list only
            # where the host lists them as trusted platform assemblies: the slim's host lists
            # every assembly of the installed runtime, and the portable's lists none of them
            # and none its bundle carries.
            if ($build.Label -in 'slim', 'portable') {
              if (-not @($lines | Where-Object { $_ -match 'Property TRUSTED_PLATFORM_ASSEMBLIES = ' }).Count) { Fail "The $($build.Label)'s trace has no TRUSTED_PLATFORM_ASSEMBLIES line." }
              $trusted = @($lines | ForEach-Object { if ($_ -match 'Property TRUSTED_PLATFORM_ASSEMBLIES = (.*)$') { $Matches[1] -split ';' } } | Where-Object { $_ })
              "  the $($build.Label)'s trusted platform assemblies: $($trusted.Count)"
              foreach ($name in @(Get-WhereInstalled)) {
                $named = [bool]@($trusted | Where-Object { ($_ -split '\\')[-1] -eq "$name.dll" }).Count
                "  they name $name`: $(if ($named) { 'yes' } else { 'no' })"
                if ($build.Label -eq 'slim' -and -not $named) { Fail "The slim's trusted platform assemblies do not name $name, so the slim does not load it before its Main." }
                if ($build.Label -eq 'portable' -and $named) { Fail "The portable's trusted platform assemblies name $name, so its module initializer loads $name by name before its Main." }
              }
              if ($build.Label -eq 'portable') {
                $bundled = Read-BundleAssemblies $build.Exe
                $listedBundled = @($trusted | Where-Object { $_.EndsWith('.dll', 'OrdinalIgnoreCase') -and $bundled.Contains((($_ -split '\\')[-1] -replace '\.dll$', '')) })
                "  of the $($bundled.Count) assemblies the portable's bundle carries, its trusted platform assemblies name $($listedBundled.Count)"
                if ($listedBundled) { Fail "The portable's trusted platform assemblies name $($listedBundled[0]), which its bundle carries." }
              }
            }
            if ($build.Label -eq 'slim') {
              $options = @($lines | ForEach-Object { if ($_ -match '\.NET root search location options: (\d+)') { [int]$Matches[1] } })
              if (-not $options.Count) { Fail "The slim's trace has no .NET root search location options line." }
              elseif ($options[0] -ne 8) { Fail "The slim's host searches for .NET beyond the registered or default install: search location options $($options[0])." }
              $fxr = @($lines | ForEach-Object { if ($_ -match 'Resolved fxr \[(.+)\]') { $Matches[1] } })
              $installedFxr = $installed.TrimEnd('\') + '\host\fxr\'
              if (-not $fxr.Count) { Fail "The slim's trace does not name the hostfxr.dll it loaded." }
              foreach ($path in $fxr) {
                if ($path.StartsWith($installedFxr, 'OrdinalIgnoreCase')) { "  the slim loaded $path, under $installedFxr" }
                else { Fail "The slim loaded $path, which is not under $installedFxr, with a hostfxr.dll planted in $folder and DOTNET_ROOT naming $decoy." }
              }

              # The native libraries in the folders the slim's runtime searches are the ones
              # a framework assembly there can import from beside it. Each one imported must
              # be in FrameworkLibraries.OwnLibraries, or the resolver sends it to System32,
              # and each one OwnLibraries names must be there.
              $searched = @($lines | ForEach-Object { if ($_ -match 'Property NATIVE_DLL_SEARCH_DIRECTORIES = (.*)$') { $Matches[1] -split ';' } } |
                Where-Object { $_ } | Sort-Object -Unique)
              $natives = @{}
              $imported = @{}
              foreach ($file in @(if ($searched) { Get-ChildItem -LiteralPath $searched -Filter '*.dll' -File })) {
                $read = Read-Imports $file.FullName
                if (-not $read.Managed) { $natives[(Get-BaseName $file.Name)] = $file.FullName }
                elseif ($file.BaseName -ne 'System.Private.CoreLib') {
                  foreach ($name in $read.Imports) { $imported[(Get-BaseName $name)] = $file.Name }
                }
              }
              $own = @(Get-OwnLibraries)
              if (-not $natives.Count -or -not $imported.Count) {
                Fail "The slim's runtime folders ($($searched -join ', ')) gave no native library or no import to compare with FrameworkLibraries.OwnLibraries."
              }
              else {
                "  native libraries in the slim's runtime folders: $(($natives.Keys | Sort-Object) -join ', ')"
                foreach ($name in ($natives.Keys | Where-Object { $imported.ContainsKey($_) } | Sort-Object)) {
                  if ($name -in $own) { "  $name, imported by $($imported[$name]), is in OwnLibraries" }
                  else { Fail "$($natives[$name]) is imported by $($imported[$name]) and FrameworkLibraries.OwnLibraries does not name it, so the resolver sends it to System32." }
                }
                foreach ($name in $own) {
                  if (-not $natives.ContainsKey($name)) { Fail "FrameworkLibraries.OwnLibraries names $name, which no folder the slim's runtime searches carries." }
                }
              }
            }
          }

          $control = [pscustomobject]@{ Label = 'slim searching DOTNET_ROOT'; Exe = (Join-Path "$tree-publish" 'InstallerClean.exe'); Arguments = @(); Wait = 20 }
          $folder = Get-RunFolder 'trace' $control.Label
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item $control.Exe $folder
          $trace = "$folder.txt"
          $env:DOTNET_HOST_TRACEFILE = $trace
          # Without this the host shows a dialog saying the desktop runtime is missing.
          $env:DOTNET_DISABLE_GUI_ERRORS = '1'
          $null = Invoke-Build $control $control.Label $folder
          Remove-Item Env:DOTNET_DISABLE_GUI_ERRORS
          if (-not (Test-Path $trace)) { Fail "The $($control.Label) wrote no host trace, so the decoy is not shown to be one the host takes." }
          else {
            $lines = @(Get-Content $trace)
            Write-Host "== $($control.Label): $($lines.Count) trace lines"
            $lines | Where-Object { $_ -match $shown } | ForEach-Object { Write-Host "  $_" }
            $options = @($lines | ForEach-Object { if ($_ -match '\.NET root search location options: (\d+)') { [int]$Matches[1] } })
            if (-not $options.Count) { Fail "The $($control.Label)'s trace has no .NET root search location options line." }
            elseif ($options[0] -ne 4) { Fail "The $($control.Label) was not published to search the DOTNET_ROOT variables alone: search location options $($options[0])." }
            $fxr = @($lines | ForEach-Object { if ($_ -match 'Resolved fxr \[(.+)\]') { $Matches[1] } })
            if (@($fxr | Where-Object { $_.StartsWith($decoyFxr, 'OrdinalIgnoreCase') }).Count) { "  the $($control.Label) loaded $($fxr -join ', '), the decoy's" }
            else { Fail "The $($control.Label) loaded $(if ($fxr.Count) { $fxr -join ', ' } else { 'no hostfxr.dll its trace names' }), not the decoy's under $decoyFxr, so the decoy is not shown to be one the host takes." }
          }

          Exit-IfFailed

      # A copy updating itself starts the newer version with /startedevent:<id> and
      # puts itself back where that version has not set the event within 60 s. Every
      # build sets it once its own code is running: the command line as it takes its
      # arguments, a window once its splash is up and its services are built. So a build
      # that stops setting it is one no copy can update to. Each build is started here
      # from a folder of its own with the switch, and the step fails where the event is
      # not set within 60 s. The time each build took to set it is printed. The command
      # line is started for its version, so it scans nothing.
      #
      # A build given the switch that cannot set the event ends at once with exit code 1,
      # having run nothing, so the copy that started it puts itself back straight away.
      # Each build is started again with an id naming no event, the command line with /s so
      # that a build going on would scan, and the step fails where a build has not ended
      # within 60 s, ends with any other exit code, or, for the command line, prints anything.
      - name: Check each build says it has started
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $failed = @()
          $builds = @(
            @{ Label = 'command line'; Exe = 'publish/cli/installerclean-cli.exe'; Arguments = @('--version') },
            @{ Label = 'portable'; Exe = 'publish/self-contained/InstallerClean.exe'; Arguments = @() },
            @{ Label = 'slim'; Exe = 'publish/framework-dependent/InstallerClean.exe'; Arguments = @() }
          )
          foreach ($build in $builds) {
            $folder = Join-Path $env:RUNNER_TEMP ('started-' + ($build.Label -replace ' ', '-'))
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
            Copy-Item $build.Exe $folder
            $exe = Join-Path $folder (Split-Path $build.Exe -Leaf)
            $id = [guid]::NewGuid().ToString('N')
            $created = $false
            $started = [System.Threading.EventWaitHandle]::new($false, 'ManualReset', "Local\InstallerClean_Started_$id", [ref]$created)
            if (-not $created) { throw "An event named for $id exists already." }
            $clock = [System.Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $exe -ArgumentList (@($build.Arguments) + "/startedevent:$id") -WorkingDirectory $folder -PassThru
            # Read now, so the exit code is kept once the process ends.
            $null = $p.Handle
            $set = $started.WaitOne([TimeSpan]::FromSeconds(60))
            $clock.Stop()
            if ($set) { "  $($build.Label) set the event $([math]::Round($clock.Elapsed.TotalSeconds, 1)) s after it was started" }
            else {
              $ended = if ($p.HasExited) { "; it ended with exit code $($p.ExitCode)" } else { '' }
              $failed += "$($build.Label) did not set the event within 60 s$ended."
            }
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; $p.WaitForExit() }
            $started.Dispose()
          }
          foreach ($build in $builds) {
            $folder = Join-Path $env:RUNNER_TEMP ('started-' + ($build.Label -replace ' ', '-'))
            $exe = Join-Path $folder (Split-Path $build.Exe -Leaf)
            $id = [guid]::NewGuid().ToString('N')
            $isCli = $build.Label -eq 'command line'
            $arguments = @(if ($isCli) { '/s' }) + "/startedevent:$id"
            $output = Join-Path $folder 'no-event-output.txt'
            $errors = Join-Path $folder 'no-event-errors.txt'
            $p = if ($isCli) {
              Start-Process -FilePath $exe -ArgumentList $arguments -WorkingDirectory $folder -NoNewWindow -PassThru `
                -RedirectStandardOutput $output -RedirectStandardError $errors
            } else {
              Start-Process -FilePath $exe -ArgumentList $arguments -WorkingDirectory $folder -PassThru
            }
            $null = $p.Handle
            if (-not $p.WaitForExit(60000)) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; $p.WaitForExit()
              $failed += "$($build.Label), given an event that does not exist, was still running after 60 s."
              continue
            }
            $printed = if ($isCli) { ((Get-Content -Raw $output) + (Get-Content -Raw $errors)) } else { '' }
            if ($p.ExitCode -ne 1) { $failed += "$($build.Label), given an event that does not exist, ended with exit code $($p.ExitCode), not 1." }
            elseif ($printed) { $failed += "$($build.Label), given an event that does not exist, printed: $printed" }
            else { "  $($build.Label), given an event that does not exist, ended with exit code 1 and printed nothing" }
          }
          $failed | ForEach-Object { Write-Host "::error::$_" }
          if ($failed.Count) { exit 1 }

      # A start-up hook is an assembly .NET loads and runs before the app's own code,
      # named by DOTNET_STARTUP_HOOKS. A small one is built here that writes its process's
      # ID and path to the file another variable names. Each build is started from a
      # folder of its own with both variables set on its process alone, and so is each
      # build published again with start-up hooks allowed, from a copy of the commit of
      # its own. Every build is started with /startedevent:<id> and waited for until it
      # sets the event, the command line for its version, so it scans nothing. The step
      # fails where a shipped build's start wrote any hook line, from its own process or
      # one it started, whether or not the build then set the event; where any build does
      # not set the event within 60 s; and where an allowing build's own process had not
      # run the hook by the time it set the event. Each allowing build's hook line is
      # printed. The builds are started with CreateProcess, which a window build asking
      # for administrator rights refuses with error 740 where the step is not elevated.
      - name: Check no build runs a start-up hook
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $failed = @()

          $hookDir = Join-Path $env:RUNNER_TEMP 'startup-hook'
          New-Item -ItemType Directory -Force -Path $hookDir | Out-Null
          Set-Content -Path (Join-Path $hookDir 'StartupHook.csproj') -Value @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
            </PropertyGroup>
          </Project>
          '@
          Set-Content -Path (Join-Path $hookDir 'StartupHook.cs') -Value @'
          internal class StartupHook
          {
              public static void Initialize()
              {
                  var marker = System.Environment.GetEnvironmentVariable("STARTUP_HOOK_MARKER");
                  if (!string.IsNullOrEmpty(marker))
                      System.IO.File.AppendAllText(marker,
                          $"{System.Environment.ProcessId} {System.Environment.ProcessPath}{System.Environment.NewLine}");
              }
          }
          '@
          dotnet build (Join-Path $hookDir 'StartupHook.csproj') -c Release --nologo -o (Join-Path $hookDir 'out')
          if ($LASTEXITCODE -ne 0) { throw "The start-up hook did not build." }
          $hook = Join-Path $hookDir 'out\StartupHook.dll'
          if (-not (Test-Path $hook)) { throw "The start-up hook build wrote no $hook." }

          function Publish-Allowing([string]$name, [string]$project, [string[]]$options) {
            $tree = Join-Path $env:RUNNER_TEMP "hooks-allowed-$name"
            git archive --format=zip -o "$tree.zip" HEAD
            if ($LASTEXITCODE -ne 0) { throw "git archive failed for the $name with start-up hooks allowed." }
            Expand-Archive -Path "$tree.zip" -DestinationPath $tree -Force
            # Printed rather than returned, so the function answers with the folder alone.
            dotnet publish (Join-Path $tree $project) -c Release -r win-x64 -p:RestoreLockedMode=true @options -p:StartupHookSupport=true --nologo -o "$tree-publish" | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "The $name with start-up hooks allowed did not publish." }
            "$tree-publish"
          }
          $selfContained = '--self-contained', 'true', '-p:PublishSingleFile=true', '-p:IncludeNativeLibrariesForSelfExtract=true', '-p:EnableCompressionInSingleFile=true'
          $cli = Publish-Allowing 'command-line' 'src/InstallerClean.Cli/InstallerClean.Cli.csproj' $selfContained
          $portable = Publish-Allowing 'portable' 'src/InstallerClean/InstallerClean.csproj' $selfContained
          $slim = Publish-Allowing 'slim' 'src/InstallerClean/InstallerClean.csproj' @('-p:PublishSelfContained=false', '-p:SelfContained=false', '-p:PublishSingleFile=true')

          $builds = @(
            [pscustomobject]@{ Label = 'command line'; Exe = 'publish/cli/installerclean-cli.exe'; Allowing = $false },
            [pscustomobject]@{ Label = 'portable'; Exe = 'publish/self-contained/InstallerClean.exe'; Allowing = $false },
            [pscustomobject]@{ Label = 'slim'; Exe = 'publish/framework-dependent/InstallerClean.exe'; Allowing = $false },
            [pscustomobject]@{ Label = 'command line with hooks allowed'; Exe = (Join-Path $cli 'installerclean-cli.exe'); Allowing = $true },
            [pscustomobject]@{ Label = 'portable with hooks allowed'; Exe = (Join-Path $portable 'InstallerClean.exe'); Allowing = $true },
            [pscustomobject]@{ Label = 'slim with hooks allowed'; Exe = (Join-Path $slim 'InstallerClean.exe'); Allowing = $true }
          )
          # One at a time, each ended and waited for before the next starts, since the
          # windows share the single-instance mutex.
          foreach ($build in $builds) {
            $folder = Join-Path $env:RUNNER_TEMP ('hook-' + ($build.Label -replace '[^A-Za-z0-9]+', '-'))
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
            Copy-Item $build.Exe $folder
            $exe = Join-Path $folder (Split-Path $build.Exe -Leaf)
            $marker = Join-Path $folder 'hook-ran.txt'
            Remove-Item -LiteralPath $marker -Force -ErrorAction SilentlyContinue
            $id = [guid]::NewGuid().ToString('N')
            $created = $false
            $started = [System.Threading.EventWaitHandle]::new($false, 'ManualReset', "Local\InstallerClean_Started_$id", [ref]$created)
            if (-not $created) { throw "An event named for $id exists already." }
            $info = [System.Diagnostics.ProcessStartInfo]::new($exe)
            $info.UseShellExecute = $false
            $info.WorkingDirectory = $folder
            if ($exe.EndsWith('installerclean-cli.exe', 'OrdinalIgnoreCase')) { $info.ArgumentList.Add('--version') }
            $info.ArgumentList.Add("/startedevent:$id")
            $info.Environment['DOTNET_STARTUP_HOOKS'] = $hook
            $info.Environment['STARTUP_HOOK_MARKER'] = $marker
            Write-Host "== $($build.Label)"
            try {
              $p = [System.Diagnostics.Process]::Start($info)
            }
            catch {
              $cause = if ($_.Exception.InnerException) { $_.Exception.InnerException } else { $_.Exception }
              $why = if ($cause.NativeErrorCode -eq 740) { ', which asks for administrator rights the step does not have' } else { '' }
              $code = if ($cause.NativeErrorCode) { " (error $($cause.NativeErrorCode))" } else { '' }
              $failed += "$($build.Label) could not be started: $($cause.Message.TrimEnd('.'))$code$why."
              $started.Dispose()
              continue
            }
            $clock = [System.Diagnostics.Stopwatch]::StartNew()
            $set = $started.WaitOne([TimeSpan]::FromSeconds(60))
            $clock.Stop()
            $ranBySignal = Test-Path -LiteralPath $marker
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            $p.WaitForExit()
            $started.Dispose()
            $lines = @(if (Test-Path -LiteralPath $marker) { Get-Content -LiteralPath $marker })
            $own = @($lines | Where-Object { $_ -like "$($p.Id) *" })
            # Every line counts against a shipped build, its own process's or a process it
            # started; an allowing build is credited with its own process's line only.
            if (-not $build.Allowing -and $lines.Count) { $failed += "$($build.Label) ran the start-up hook DOTNET_STARTUP_HOOKS names: $($lines -join '; ')"; continue }
            if (-not $set) {
              $failed += if ($build.Allowing) { "$($build.Label) did not set the event within 60 s, so whether the hook ran by then is not judged." }
                         else { "$($build.Label) did not set the event within 60 s; no hook ran in it before it was ended." }
              continue
            }
            $after = "$([math]::Round($clock.Elapsed.TotalSeconds, 1)) s"
            if ($build.Allowing) {
              if (-not $own.Count) { $failed += "$($build.Label) ran no hook, so a shipped build running none shows nothing." }
              elseif (-not $ranBySignal) { $failed += "$($build.Label) ran the hook only after it set the event." }
              else { "  $($build.Label) set the event after $after, and the hook ran in it: $($own -join '; ')" }
            }
            else { "  $($build.Label) set the event after $after, and no hook ran in it" }
          }
          $failed | ForEach-Object { Write-Host "::error::$_" }
          if ($failed.Count) { exit 1 }

      # Each single-file bundle carries its runtimeconfig.json, stored uncompressed, at the
      # offset and size its manifest's header gives. The three shipped builds must have
      # System.Net.SocketsHttpHandler.Http3Support and System.Net.Http.EnableActivityPropagation
      # set to false, and System.StartupHookProvider.IsSupported set to false; the three builds
      # the start-up hook step publishes with hooks allowed must have the last set to true.
      # Each bundle's offset and size are printed with the values read. A bundle with no
      # runtimeconfig, one that does not parse, or one missing any of the keys fails the step.
      - name: Check each build's runtimeconfig for HTTP/3, HTTP activities and start-up hooks
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          . (Join-Path $env:RUNNER_TEMP 'native.ps1')
          $http3 = 'System.Net.SocketsHttpHandler.Http3Support'
          $activity = 'System.Net.Http.EnableActivityPropagation'
          $hooks = 'System.StartupHookProvider.IsSupported'
          $allowed = Join-Path $env:RUNNER_TEMP 'hooks-allowed'
          $bundles = @(
            [pscustomobject]@{ Label = 'command line'; Exe = 'publish/cli/installerclean-cli.exe'; Expected = [ordered]@{ $http3 = $false; $activity = $false; $hooks = $false } },
            [pscustomobject]@{ Label = 'portable'; Exe = 'publish/self-contained/InstallerClean.exe'; Expected = [ordered]@{ $http3 = $false; $activity = $false; $hooks = $false } },
            [pscustomobject]@{ Label = 'slim'; Exe = 'publish/framework-dependent/InstallerClean.exe'; Expected = [ordered]@{ $http3 = $false; $activity = $false; $hooks = $false } },
            [pscustomobject]@{ Label = 'command line with hooks allowed'; Exe = "$allowed-command-line-publish/installerclean-cli.exe"; Expected = [ordered]@{ $hooks = $true } },
            [pscustomobject]@{ Label = 'portable with hooks allowed'; Exe = "$allowed-portable-publish/InstallerClean.exe"; Expected = [ordered]@{ $hooks = $true } },
            [pscustomobject]@{ Label = 'slim with hooks allowed'; Exe = "$allowed-slim-publish/InstallerClean.exe"; Expected = [ordered]@{ $hooks = $true } }
          )
          foreach ($bundle in $bundles) {
            Write-Host "== $($bundle.Label)"
            try {
              if (-not (Test-Path -LiteralPath $bundle.Exe)) {
                $from = if ($bundle.Exe.StartsWith($allowed)) { ', which the start-up hook step publishes' } else { '' }
                throw "$($bundle.Exe) does not exist$from."
              }
              $header = Read-BundleHeader $bundle.Exe
              $header.Reader.Dispose()
              if ($header.ConfigSize -le 0 -or $header.ConfigOffset -le 0 -or $header.ConfigOffset + $header.ConfigSize -gt $header.Data.Length) {
                throw "the bundle carries no runtimeconfig.json (offset $($header.ConfigOffset), size $($header.ConfigSize))."
              }
              Write-Host "  runtimeconfig.json at offset $($header.ConfigOffset), $($header.ConfigSize) bytes"
              $config = [Text.Encoding]::UTF8.GetString($header.Data, $header.ConfigOffset, $header.ConfigSize) | ConvertFrom-Json -AsHashtable
              $properties = $config.runtimeOptions.configProperties
              if ($properties -isnot [System.Collections.IDictionary]) { throw "its runtimeconfig.json has no runtimeOptions.configProperties." }
            }
            catch {
              Fail "$($bundle.Label): $($_.Exception.Message)"
              continue
            }
            foreach ($key in $bundle.Expected.Keys) {
              $want = $bundle.Expected[$key]
              if (-not $properties.Contains($key)) { Fail "$($bundle.Label): its runtimeconfig.json does not set $key."; continue }
              $value = $properties[$key]
              Write-Host "  $key = $(ConvertTo-Json -Compress -InputObject $value)"
              if ($value -isnot [bool] -or $value -ne $want) { Fail "$($bundle.Label): $key is $(ConvertTo-Json -Compress -InputObject $value), where it should be $($want.ToString().ToLowerInvariant())." }
            }
          }
          Exit-IfFailed

      - name: Check no window left a report
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $left = @()
          foreach ($folder in (Join-Path $env:LOCALAPPDATA 'InstallerClean'), (Join-Path $env:LOCALAPPDATA 'NoFaff\InstallerClean')) {
            $report = Join-Path $folder 'last-run.json'
            if (Test-Path $report) { $left += "A window left a report waiting: $report." } else { "  no $report" }
            $settings = Join-Path $folder 'settings.json'
            if ((Test-Path $settings) -and ((Get-Content -Raw $settings) -match '"reportToSend"\s*:\s*true')) {
              $left += "A window marked a report to send in $settings."
            }
          }
          $left | ForEach-Object { Write-Host "::error::$_" }
          if ($left.Count) { exit 1 }

      # The setup is compiled from the builds this job published, as build-and-test
      # compiles it, so it carries them.
      - name: Compile the setup
        if: ${{ !cancelled() && env.PROCMON != '' }}
        run: |
          choco install innosetup --version=6.7.1 --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup did not install." }
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}" -Filter ISCC.exe -Recurse -Depth 1 -ErrorAction SilentlyContinue |
                  Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "ISCC.exe not found under ${env:ProgramFiles(x86)} after installing Inno Setup." }
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version |
                     Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw "Could not read <Version> from Directory.Build.props." }
          & $iscc "/DAppVersion=$version" installer\InstallerClean.iss | Tee-Object -Variable compileOutput
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          $warnings = @($compileOutput | Where-Object { $_ -like 'Warning: *' })
          if ($warnings.Count -gt 0) { $warnings; throw "ISCC printed warnings, which fail the compile in build-and-test too." }
          "SETUP_VERSION=$version" | Add-Content $env:GITHUB_ENV

      # The setup is copied alone into a folder of its own, as a download sits in
      # Downloads, and run silently under Process Monitor, twice. A silent install starts
      # no window: the [Run] entry that opens the app needs /UPDATEFROMAPP and the other
      # is skipifsilent, so nothing here takes the single-instance mutex or writes a
      # report, and these runs come after every step that reads the app's own files.
      #
      # The setup exe is judged by its process ID and name: every look it makes for a DLL
      # in its own folder is printed, and the job fails where it loads an image from that
      # folder. Each process it starts, Inno Setup's setup.tmp from an is-*.tmp folder in
      # %TEMP%, and each process those start, is judged the same way against its own
      # folder, read from its own load of its image. An image in any is-*.tmp folder
      # passes only where the same process created it earlier in the record: such a folder
      # is made new with a new name on each run, and the owner and permissions of each are
      # printed as the setup made them. The job also fails where the
      # setup does not exit with 0, starts nothing from an is-*.tmp folder, or leaves no
      # uninstall entry whose DisplayVersion is the one built; the entry is removed before
      # each run, so the one read is that run's.
      #
      # The second run's folder holds the genuine file at every path the setup exe looked
      # at in its own folder in the first, and the job fails where the setup reads or
      # loads one, and where a plant was not looked for, not found, gone or changed.
      #
      # First the checks on the processes the setup starts are run over a record made up
      # for the purpose, and the job fails unless each fails exactly where it must
      # (Test-SetupControls in native-libraries.ps1).
      - name: Run the setup from its own folder, under both passes
        if: ${{ !cancelled() && env.PROCMON != '' && env.SETUP_VERSION != '' }}
        shell: pwsh
        run: |
          . (Join-Path $env:RUNNER_TEMP 'native.ps1')
          Test-SetupControls
          $setup = (Resolve-Path "publish/InstallerClean-$env:SETUP_VERSION-setup.exe").Path

          # Prints with Write-Host, so what it answers is the run and its reading alone.
          $uninstallKey = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\InstallerClean_is1'

          function Invoke-Setup([string]$pass, $plants) {
            # The entry is removed first, so the one read after the run is this run's.
            Remove-Item -Path $uninstallKey -Recurse -Force -ErrorAction SilentlyContinue
            if (Test-Path $uninstallKey) { throw "The uninstall entry could not be removed before the $pass pass." }
            $folder = Get-RunFolder $pass 'setup'
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
            Copy-Item -LiteralPath $setup -Destination $folder
            $placed = @(Add-Plants $folder @($plants))
            $exe = Join-Path $folder (Split-Path $setup -Leaf)
            $out = Join-Path $env:RUNNER_TEMP "setup-$pass-temp.txt"
            $stop = Join-Path $env:RUNNER_TEMP "setup-$pass-temp.stop"
            $watch = Start-TempWatch $out $stop
            Start-Record "setup-$pass"
            try {
              $p = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -WorkingDirectory $folder -PassThru
              $null = $p.Handle
              if (-not $p.WaitForExit(300000)) { $p.Kill($true); $p.WaitForExit(); Fail "The setup was still running after 300 s and was ended with every process it started." }
            }
            finally {
              Stop-TempWatch $watch $stop
              $csv = Stop-Record "setup-$pass"
            }
            Write-Host "  the setup, process $($p.Id), exited with $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { Fail "The setup, $pass pass, exited with $($p.ExitCode)." }

            $run = [pscustomobject]@{ Label = "setup, $pass pass"; Build = [pscustomobject]@{ Exe = $setup }; Folder = $folder
              Exe = Split-Path $exe -Leaf; Id = $p.Id; Placed = $placed; BundleFiles = @(); TempFolders = @() }
            $kept = [System.Collections.Generic.List[string]]::new()
            $kept.Add("$($run.Id)`t$($run.Exe)")
            $byProcess = Read-Record $csv @($run)
            $read = Read-Run $run $byProcess
            if ($read) {
              $run.TempFolders = @(Test-OwnLoads $run $byProcess[[string]$run.Id])
              if ($pass -eq 'second') { Test-PlantedRun $run $read }
              $started = @(Test-StartedProcesses $csv $run $byProcess[[string]$run.Id] '')
              foreach ($child in $started) { $kept.Add("$($child.Id)`t$($child.Exe)") }
              Show-TempFolders $out (@($run) + $started)
            }
            Set-Content -Path (Join-Path $env:RUNNER_TEMP "kept-setup-$pass.txt") -Value $kept

            $shown = (Get-ItemProperty $uninstallKey -ErrorAction SilentlyContinue).DisplayVersion
            if ($shown -eq $env:SETUP_VERSION) { Write-Host "  the uninstall entry's DisplayVersion is $shown" }
            else { Fail "The uninstall entry's DisplayVersion is '$shown' after the $pass pass, not $env:SETUP_VERSION." }
            [pscustomobject]@{ Run = $run; Read = $read }
          }

          $first = Invoke-Setup 'first' @()
          $plants = @()
          if ($first.Read) {
            $plants = @(Get-RunPlants $first.Run $first.Read @() @{} @())
            "== Planted for the setup's second pass"
            if (-not $plants) { '  none' }
            foreach ($plant in $plants) { "  $($plant.Place) $($plant.Path): $($plant.Kind), $($plant.Source)" }
          }
          $null = Invoke-Setup 'second' $plants
          Exit-IfFailed

      # A Process Monitor record holds every process on the runner, so only the rows of
      # the setup's processes, each by its process ID and name, and of every process
      # named as one of the builds' exes are kept, in the record's order,
      # each column as recorded. The log's row N for a process is its Nth row in the
      # file with that PID. Detail is emptied on a row that starts or creates a process
      # and must stay so, since the artifact is public. The host traces are kept whole, and
      # so is each crash log the app keeps as the job leaves it, beside the first pass's
      # copy of it: crash.log from the app's folder, nofaff-crash.log from the NoFaff one.
      # A run that ended before a record was saved keeps what there is, and this step
      # judges nothing. The artifact's name carries the run attempt, so a job run again
      # uploads under a name of its own.
      - name: Keep the Process Monitor rows and the host traces
        if: ${{ always() }}
        shell: pwsh
        run: |
          $kept = Join-Path $env:RUNNER_TEMP 'kept'
          New-Item -ItemType Directory -Force -Path $kept | Out-Null
          $exes = 'installerclean-cli.exe', 'InstallerClean.exe'
          foreach ($name in 'first', 'second') {
            $csv = Join-Path $env:RUNNER_TEMP "procmon\$name.csv"
            if (-not (Test-Path $csv)) { "  no $csv"; continue }
            $rows = @(Import-Csv $csv | Where-Object { $_.'Process Name' -in $exes } | ForEach-Object {
              if ($_.Operation -in 'Process Start', 'Process Create') { $_.Detail = '' }
              $_
            })
            $rows | Export-Csv -Path (Join-Path $kept "$name.csv") -NoTypeInformation -UseQuotes Always
            "  kept $($rows.Count) rows of $csv"
          }
          foreach ($name in 'setup-first', 'setup-second') {
            $csv = Join-Path $env:RUNNER_TEMP "procmon\$name.csv"
            $ids = Join-Path $env:RUNNER_TEMP "kept-$name.txt"
            if (-not (Test-Path $csv) -or -not (Test-Path $ids)) { "  no $name record to keep"; continue }
            $names = @{}
            foreach ($line in @(Get-Content $ids | Where-Object { $_ })) { $id, $exe = $line -split "`t"; $names[$id] = $exe }
            $rows = @(Import-Csv $csv | Where-Object { $names.ContainsKey($_.PID) -and $_.'Process Name' -eq $names[$_.PID] } | ForEach-Object {
              if ($_.Operation -in 'Process Start', 'Process Create') { $_.Detail = '' }
              $_
            })
            $rows | Export-Csv -Path (Join-Path $kept "$name.csv") -NoTypeInformation -UseQuotes Always
            "  kept $($rows.Count) rows of $csv, for the processes $(@($names.Keys) -join ', ')"
          }
          foreach ($trace in @(Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'trace-*.txt') -ErrorAction SilentlyContinue)) {
            Copy-Item -LiteralPath $trace.FullName -Destination $kept
            "  kept $($trace.FullName)"
          }
          $native = Join-Path $env:RUNNER_TEMP 'native.ps1'
          if (Test-Path $native) { . $native } else { "  no $native, so the crash logs' folders are not known"; $crashLogFolders = @() }
          foreach ($folder in $crashLogFolders) {
            $crashLog = Join-Path $env:LOCALAPPDATA "$folder\crash.log"
            $name = if ($folder -eq 'InstallerClean') { 'crash.log' } else { 'nofaff-crash.log' }
            if (Test-Path -LiteralPath $crashLog) { Copy-Item -LiteralPath $crashLog -Destination (Join-Path $kept $name); "  kept $crashLog" }
            elseif ($folder -eq 'InstallerClean') { "  no $crashLog" }
          }

      - name: Upload the Process Monitor rows and the host traces
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: process-monitor-records-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kept
          if-no-files-found: warn
          retention-days: 7

  # The command line's own download, updating to a newer version, waits up to a minute
  # for the newer version to say its own code is running before it hands the run over.
  # This job runs that wait in a single-file build, offline, against three newer files.
  #
  # The old copy is the command line published as a single file from this commit with
  # the Debug configuration, so it reads INSTALLERCLEAN_DEBUG_PRETEND_LATEST, which has
  # its update check answer that v9.9.9 is the newest release without asking GitHub, and
  # INSTALLERCLEAN_DEBUG_LOCAL_DOWNLOAD, which has its download fetch the named file in
  # place of the release's, and INSTALLERCLEAN_DEBUG_LOCAL_MANIFEST, which has it read the
  # named file as the release's update.json. A release above 3.5.0 has to carry one, so
  # every run is given a file: one that lists the command line with nothing required, or,
  # in the three runs that check the refusal, one with a schema it does not read, one
  # requiring something it does not know, and one that does not list the command line.
  # Those three print the line saying the newer version can't be installed automatically
  # and the release page, download nothing, leave the file at the path as it was, write
  # no 3005 or 3006 and nothing to crash.log, and run the command with the old copy.
  # Everything after the download, the checks on the file, the
  # rename, the start and the wait, runs as it does in a release.
  #
  # The three newer files each carry the file version 9.9.9, which the old copy checks
  # before it renames anything:
  # - the command line published as a Release build stamped 9.9.9, which says it has
  #   started and runs the command. A Release build ignores both switches, which it
  #   inherits with the old copy's environment, so it does not update again;
  # - a stand-in that never says it has started and sleeps, which the old copy ends
  #   after 60 seconds before it puts itself back;
  # - the same stand-in ending at once with exit code 7.
  # The stand-in is a console program built here, published as one self-contained file
  # named installerclean-cli.exe, since the old copy starts the newer file under that
  # name from its own folder. It ignores its arguments and reads what to do from
  # START_CHECK_STAND_IN.
  #
  # Each newer file is offered to a fresh copy of the old one in a folder of its own,
  # one after another, each run with /s and its input and output redirected, so nobody
  # can answer it, and bounded at 240 s. The job fails where:
  # - the old copy does not print what it should, or prints what it should not: the
  #   newer version installed, where it said it had started; the install failed and the
  #   command run with the old version, where it did not;
  # - the Application log, read for up to 5 s after each run for the entries made since
  #   it started, does not hold one 3005 naming the update to 9.9.9 where the newer
  #   version started, or one 3006 naming the failed install where it did not, or holds
  #   the other. The app registers its own event source, as it does on a PC. Where an
  #   entry is missing the step prints whether the run printed the note saying the
  #   Application log refused an entry, and the line crash.log carries saying why;
  # - the file at the path does not carry the version that should be there, or a .new
  #   is left beside it, or a .old where the old copy put itself back;
  # - crash.log does not gain the line saying the newer version did not say it had
  #   started within 60 seconds, or that it ended with exit code 7 before it did, and
  #   the line saying the newer version could not be started; or gains a line saying
  #   Windows would not end the newer version or it had not ended;
  # - the run that waited out the minute took less than 60 s, or the one whose newer
  #   file ended at once took 60 s or more;
  # - the run's exit code is not that of a second run of the file now at the path, with
  #   /s /noupdate, or a stand-in is still running from the run's folder.
  #
  # The 9.9.9 build's own run checks GitHub for updates as a Release build does, and
  # that is the only request any build in the job makes of the network.
  start-check:
    name: The start check (Windows)
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Publish the old copy, the 9.9.9 command line and the stand-in
        shell: pwsh
        run: |
          dotnet publish src/InstallerClean.Cli/InstallerClean.Cli.csproj -c Debug -r win-x64 --self-contained true -p:RestoreLockedMode=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --nologo -o publish/old
          if ($LASTEXITCODE -ne 0) { throw "The old copy did not publish." }
          dotnet publish src/InstallerClean.Cli/InstallerClean.Cli.csproj -c Release -r win-x64 --self-contained true -p:RestoreLockedMode=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:Version=9.9.9 --nologo -o publish/newer
          if ($LASTEXITCODE -ne 0) { throw "The 9.9.9 command line did not publish." }

          $standIn = Join-Path $env:RUNNER_TEMP 'stand-in'
          New-Item -ItemType Directory -Force -Path $standIn | Out-Null
          Set-Content -Path (Join-Path $standIn 'StandIn.csproj') -Value @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <AssemblyName>installerclean-cli</AssemblyName>
              <Version>9.9.9</Version>
            </PropertyGroup>
          </Project>
          '@
          Set-Content -Path (Join-Path $standIn 'Program.cs') -Value @'
          var mode = System.Environment.GetEnvironmentVariable("START_CHECK_STAND_IN");
          if (mode == "sleep") System.Threading.Thread.Sleep(System.TimeSpan.FromSeconds(300));
          return mode == "exit" ? 7 : 3;
          '@
          dotnet publish (Join-Path $standIn 'StandIn.csproj') -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true --nologo -o (Join-Path $standIn 'out')
          if ($LASTEXITCODE -ne 0) { throw "The stand-in did not publish." }
          if (-not (Test-Path (Join-Path $standIn 'out\installerclean-cli.exe'))) { throw "The stand-in's publish wrote no installerclean-cli.exe." }

      - name: Update the old copy to each newer file
        shell: pwsh
        run: |
          $failures = [System.Collections.Generic.List[string]]::new()
          function Fail([string]$message) { $failures.Add($message); Write-Host "::error::$message" }

          $resx = [xml](Get-Content -Raw src/InstallerClean.Core/Resources/Strings.resx)
          function Line([string]$name) {
            $value = ($resx.root.data | Where-Object name -eq $name).value
            if (-not $value) { throw "Strings.resx has no $name." }
            $value
          }

          # MAJOR.MINOR.BUILD of a file's version resource, as the old copy reads it.
          function Version3([string]$file) {
            $v = (Get-Item -LiteralPath $file).VersionInfo.FileVersion -as [version]
            if (-not $v) { return '' }
            "$($v.Major).$($v.Minor).$([Math]::Max($v.Build, 0))"
          }

          $oldExe = (Resolve-Path 'publish/old/installerclean-cli.exe').Path
          $old = Version3 $oldExe
          $latest = '9.9.9'
          $signals = (Resolve-Path 'publish/newer/installerclean-cli.exe').Path
          $standIn = (Resolve-Path (Join-Path $env:RUNNER_TEMP 'stand-in\out\installerclean-cli.exe')).Path
          "  the old copy carries $old"
          foreach ($file in $signals, $standIn) {
            $carried = Version3 $file
            if ($carried -ne $latest) { throw "$file carries '$carried', not $latest." }
            "  $file carries $carried"
          }
          if ($old -eq $latest -or -not $old) { throw "The old copy carries '$old'." }

          $crashLog = Join-Path $env:LOCALAPPDATA 'InstallerClean\crash.log'
          "  crash.log is read at $crashLog"
          function CrashLogLength { if (Test-Path -LiteralPath $crashLog) { (Get-Item -LiteralPath $crashLog).Length } else { 0 } }
          function CrashLogSince([long]$length) {
            if (-not (Test-Path -LiteralPath $crashLog)) { return '' }
            $bytes = [System.IO.File]::ReadAllBytes($crashLog)
            if ($bytes.Length -lt $length) { $length = 0 }
            [System.Text.Encoding]::UTF8.GetString($bytes, [int]$length, $bytes.Length - [int]$length)
          }

          # Runs exe with its input closed and its output read to the end, bounded at
          # $seconds, after which the process and everything it started are ended.
          function Run([string]$exe, [string[]]$arguments, [hashtable]$environment, [int]$seconds) {
            $info = [System.Diagnostics.ProcessStartInfo]::new($exe)
            foreach ($a in $arguments) { $info.ArgumentList.Add($a) }
            $info.UseShellExecute = $false
            $info.WorkingDirectory = Split-Path $exe
            $info.RedirectStandardInput = $true
            $info.RedirectStandardOutput = $true
            $info.RedirectStandardError = $true
            foreach ($name in $environment.Keys) { $info.Environment[$name] = $environment[$name] }
            $clock = [System.Diagnostics.Stopwatch]::StartNew()
            $p = [System.Diagnostics.Process]::Start($info)
            $p.StandardInput.Close()
            $out = $p.StandardOutput.ReadToEndAsync()
            $err = $p.StandardError.ReadToEndAsync()
            $ended = $p.WaitForExit($seconds * 1000)
            if (-not $ended) { $p.Kill($true) }
            $p.WaitForExit()
            $clock.Stop()
            # A process the run started and left running from its folder holds the output
            # open, so it is ended, and named, before the output is read to its end.
            $left = @(Leftovers (Split-Path $exe))
            $left | ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }
            $null = $out.Wait(10000)
            $null = $err.Wait(10000)
            [pscustomobject]@{
              ExitCode = if ($ended) { $p.ExitCode } else { $null }
              Output = $(if ($out.IsCompleted) { $out.Result } else { '' }) + $(if ($err.IsCompleted) { $err.Result } else { '' })
              Seconds = $clock.Elapsed.TotalSeconds
              Left = @($left | ForEach-Object { "$($_.Id) $(if ($_.Path) { $_.Path } else { '(path not readable)' })" })
            }
          }

          # Every installerclean-cli process running from $folder, and every one whose path
          # cannot be read, since such a process could be running from there.
          function Leftovers([string]$folder) {
            @(Get-Process -Name 'installerclean-cli' -ErrorAction SilentlyContinue |
              Where-Object { -not $_.Path -or $_.Path.StartsWith($folder, 'OrdinalIgnoreCase') })
          }

          # The InstallerClean entries with $id written since $since. Only the answer that no
          # entry matches reads as none; any other failure to read the log stops the step.
          # An entry's text is the first of its insertion strings, which does not depend on
          # the message file the source is registered with.
          function Read-Entries([datetime]$since, [int]$id) {
            try {
              @(Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'InstallerClean'; Id = $id; StartTime = $since } -ErrorAction Stop |
                ForEach-Object { [pscustomobject]@{ Text = $(if ($_.Properties.Count) { [string]$_.Properties[0].Value } else { $_.Message }) } })
            }
            catch {
              if ($_.FullyQualifiedErrorId -like 'NoMatchingEventsFound*' -or $_.Exception.Message -like '*No events were found*' -or
                  $_.Exception.Message -like '*no providers*InstallerClean*' -or $_.FullyQualifiedErrorId -like 'NoMatchingProvidersFound*') { return , @() }
              throw "The Application log could not be read: $($_.Exception.Message)"
            }
          }

          # The entries with $id the InstallerClean source wrote since $since whose text
          # is like $like, read again every 250 ms for up to 5 s until one is there.
          function Entries([datetime]$since, [int]$id, [string]$like) {
            $clock = [System.Diagnostics.Stopwatch]::StartNew()
            do {
              $found = @(Read-Entries $since $id | Where-Object { $_.Text -like $like })
              if ($found.Count) { return , $found }
              Start-Sleep -Milliseconds 250
            } while ($clock.Elapsed.TotalSeconds -lt 5)
            , @()
          }

          # An update.json listing the command line with nothing required.
          $allowsCli = '{"schema": 1, "downloads": {"cli": {"requires": []}}}'

          function Update([string]$label, [string]$newerFile, [string]$standInMode, [string]$manifest = $allowsCli) {
            Write-Host "== $label"
            $folder = Join-Path $env:RUNNER_TEMP "start-check-$label"
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
            $manifestFile = Join-Path $env:RUNNER_TEMP "start-check-$label-update.json"
            Set-Content -LiteralPath $manifestFile -Value $manifest -Encoding utf8NoBOM -NoNewline
            Copy-Item -LiteralPath $oldExe -Destination $folder
            $exe = Join-Path $folder 'installerclean-cli.exe'
            foreach ($left in "$exe.old", "$exe.new") { if (Test-Path -LiteralPath $left) { throw "$left is there before the run." } }
            $logLength = CrashLogLength
            $since = Get-Date
            $run = Run $exe @('/s') @{
              INSTALLERCLEAN_DEBUG_PRETEND_LATEST = "v$latest"
              INSTALLERCLEAN_DEBUG_LOCAL_DOWNLOAD = $newerFile
              INSTALLERCLEAN_DEBUG_LOCAL_MANIFEST = $manifestFile
              START_CHECK_STAND_IN = $standInMode
            } 240
            # Everything below is printed with Write-Host, since what the function writes
            # to its output is what it answers with.
            Write-Host "::group::$label, the run's output"
            Write-Host $run.Output
            Write-Host "::endgroup::"
            Write-Host "  exit code $($run.ExitCode), after $([math]::Round($run.Seconds, 1)) s"
            if ($null -eq $run.ExitCode) { Fail "$label`: the run was still going after 240 s and was ended." }
            $logged = CrashLogSince $logLength
            if ($logged) { Write-Host "  crash.log gained:"; $logged -split "`r?`n" | Where-Object { $_ } | ForEach-Object { Write-Host "    $_" } }
            else { Write-Host "  crash.log gained nothing" }
            if ($run.Left) { Fail "$label`: a process was still running from $folder when the run ended, and was ended: $($run.Left -join ', ')" }
            [pscustomobject]@{ Label = $label; Exe = $exe; Run = $run; Since = $since; Logged = $logged }
          }

          function Expect-Printed($update, [string[]]$printed, [string[]]$notPrinted) {
            foreach ($line in $printed) {
              if ($update.Run.Output.Contains($line)) { "  printed: $line" } else { Fail "$($update.Label): it did not print: $line" }
            }
            foreach ($line in $notPrinted) {
              if ($update.Run.Output.Contains($line)) { Fail "$($update.Label): it printed: $line" } else { "  did not print: $line" }
            }
          }

          function Expect-Entries($update, [int]$id, [string]$like, [int]$otherId) {
            $found = Entries $update.Since $id $like
            if ($found.Count -eq 1) { "  the Application log holds one $id`: $($found[0].Text)" }
            else {
              $note = $update.Run.Output.Contains((Line 'Cli.EventLogUnavailable'))
              $why = @($update.Logged -split "`r?`n" | Where-Object { $_ -like '*An entry was not written to the Application log*' })
              Fail ("$($update.Label): $($found.Count) entries with Event ID $id like '$like', where one was expected. " +
                "The run $(if ($note) { 'printed' } else { 'did not print' }) the note that the Application log refused an entry" +
                $(if ($why) { "; crash.log: $($why -join ' | ')" } else { '; crash.log names no refused entry' }) + '.')
            }
            $other = @(Read-Entries $update.Since $otherId)
            if ($other) { Fail "$($update.Label): the Application log holds $($other.Count) entries with Event ID $otherId since the run started: $(($other | ForEach-Object Text) -join ' | ')" }
            else { "  no $otherId since the run started" }
          }

          function Expect-File($update, [string]$version, [bool]$noOld) {
            $carried = Version3 $update.Exe
            if ($carried -eq $version) { "  the file at the path carries $carried" } else { Fail "$($update.Label): the file at the path carries '$carried', not $version." }
            if (Test-Path -LiteralPath "$($update.Exe).new") { Fail "$($update.Label): $($update.Exe).new is left." } else { "  no .new" }
            if ($noOld) {
              if (Test-Path -LiteralPath "$($update.Exe).old") { Fail "$($update.Label): $($update.Exe).old is left." } else { "  no .old" }
            }
          }

          function Expect-Logged($update, [string[]]$logged, [string[]]$notLogged) {
            foreach ($line in $logged) {
              if ($update.Logged.Contains($line)) { "  crash.log: $line" } else { Fail "$($update.Label): crash.log did not gain: $line" }
            }
            foreach ($line in $notLogged) {
              if ($update.Logged.Contains($line)) { Fail "$($update.Label): crash.log gained: $line" } else { "  crash.log did not gain: $line" }
            }
          }

          function Expect-ExitCode($update) {
            if ($null -eq $update.Run.ExitCode) { "  the exit code is not compared, since the run was ended"; return }
            $again = Run $update.Exe @('/s', '/noupdate') @{} 240
            "  a second run of the file at the path, with /s /noupdate, exited with $($again.ExitCode)"
            if ($update.Run.ExitCode -ne $again.ExitCode) { Fail "$($update.Label): the run exited with $($update.Run.ExitCode), the file at the path with $($again.ExitCode)." }
          }

          $available = (Line 'UpdateNotice.Available') -f $latest
          $downloading = (Line 'UpdateNotice.Downloading') -f $latest
          $installed = (Line 'Cli.UpdateInstalled') -f $latest
          $installFailed = Line 'UpdateNotice.InstallFailed'
          $runningInstead = (Line 'Cli.UpdateRunningInstead') -f '/s', $old
          $notStarted = 'The newer version could not be started.'
          $endRefused = 'Windows refused the request to end the newer version'
          $notEnded = 'The newer version had not ended a few seconds after'
          $updatedLike = "*updated itself from $old to $latest and ran /s with it*"

          # Each crash.log line the checks look for, present or absent, is text the code
          # under src/ still writes, so an absence cannot pass on a line nothing writes.
          $source = (Get-ChildItem -Path src -Recurse -Filter *.cs | Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' -and $_.FullName -notmatch 'InstallerClean\.Tests' } |
                     ForEach-Object { Get-Content -Raw -LiteralPath $_.FullName }) -join "`n"
          foreach ($line in 'The newer version ended with exit code ', ' before it said it had started.',
                            'The newer version did not say it had started within ', $notStarted, $endRefused, $notEnded) {
            if (-not $source.Contains($line)) { throw "No C# file under src/ holds '$line', so the crash.log check on it would read nothing." }
          }
          $failedLike = "*could not update itself from $old to $latest (the install failed)*"

          $update = Update 'signals' $signals ''
          Expect-Printed $update @($available, $downloading, $installed) @($installFailed, $runningInstead)
          Expect-Entries $update 3005 $updatedLike 3006
          Expect-File $update $latest $false
          Expect-Logged $update @() @('did not say it had started', 'before it said it had started', $notStarted)
          Expect-ExitCode $update

          $update = Update 'exits' $standIn 'exit'
          Expect-Printed $update @($available, $downloading, $installFailed, $runningInstead) @($installed)
          Expect-Entries $update 3006 $failedLike 3005
          Expect-File $update $old $true
          Expect-Logged $update @('The newer version ended with exit code 7 before it said it had started.', $notStarted) @($endRefused, $notEnded)
          if ($update.Run.Seconds -ge 60) { Fail "exits: the run took $([math]::Round($update.Run.Seconds, 1)) s, though the newer file ended at once." }
          Expect-ExitCode $update

          $update = Update 'sleeps' $standIn 'sleep'
          Expect-Printed $update @($available, $downloading, $installFailed, $runningInstead) @($installed)
          Expect-Entries $update 3006 $failedLike 3005
          Expect-File $update $old $true
          Expect-Logged $update @('The newer version did not say it had started within 60 seconds.', $notStarted) @($endRefused, $notEnded)
          if ($update.Run.Seconds -lt 60) { Fail "sleeps: the run took $([math]::Round($update.Run.Seconds, 1)) s, less than the minute it waits." }
          Expect-ExitCode $update

          $cannotInstall = (Line 'UpdateNotice.CannotInstallAutomatically') -f $latest
          $releasePage = (Line 'Cli.UpdateDownloadLink') -f (Line 'UpdateNotice.Download'), "https://github.com/no-faff/InstallerClean/releases/tag/v$latest"
          $refusals = [ordered]@{
            'refused by its schema'      = '{"schema": 2, "downloads": {"cli": {"requires": []}}}'
            'refused by its requirement' = '{"schema": 1, "downloads": {"cli": {"requires": ["dotnet-desktop-99"]}}}'
            'refused by its absence'     = '{"schema": 1, "downloads": {"setup": {"requires": []}}}'
          }
          foreach ($label in $refusals.Keys) {
            $update = Update $label $signals '' $refusals[$label]
            Expect-Printed $update @($available, $cannotInstall, $releasePage) @($downloading, $installed, $installFailed, $runningInstead)
            foreach ($id in 3005, 3006) {
              $entries = @(Read-Entries $update.Since $id)
              if ($entries) { Fail "$label`: the Application log holds $($entries.Count) entries with Event ID $id since the run started." }
              else { "  no $id since the run started" }
            }
            Expect-File $update $old $true
            if ($update.Logged) { Fail "$label`: crash.log gained text." } else { "  crash.log gained nothing" }
            Expect-ExitCode $update
          }

          if ($failures.Count) {
            "$($failures.Count) checks failed:"
            $failures | ForEach-Object { "  $_" }
            exit 1
          }
          'Every check passed.'
